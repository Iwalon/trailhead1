      srcNodeId:nodeId, srcIndex:limIndex, title:L.name, gap:L.detail||"", chat:[], slots:{}, linked:[], explore:null};

/* "Kirchenbauer 2023" — how a person would name a paper in passing */
function shortCite(node){
  const a = node.article || {}, c = (node.detail && node.detail.citation) || {};
  let fam = (Array.isArray(c.authors) && c.authors[0] && c.authors[0].family) || "";
  if(!fam && a.authors){
    const raw = String(a.authors).split(/,| and | & /)[0].trim();
    const bits = raw.split(/\s+/).filter(w=>!/^[A-Z]\.?$/.test(w));
    fam = bits[bits.length-1] || raw;
  }
  fam = String(fam).replace(/\s*et al\.?$/i,"").trim();
  const yr = a.year || c.year || "";
  if(fam && yr) return `${fam} ${yr}`;
  if(fam) return fam;
  const t = a.headline || a.title || "that paper";
  return t.length > 34 ? t.slice(0,32).trim() + "\u2026" : t;
}
/* Turn the [P3] keys Scout writes into clickable citations */
function linkKeys(text, map){
  const used = new Set();
  const html = esc(String(text||"")).replace(/\s*\[(P\d+)\]/g, (m, k) => {
    const n = map[k];
    if(!n) return "";                               // unknown key: drop it rather than show the code
    used.add(n.id);
    return ` <button class="paperchip" data-act="ideajump" data-id="${n.id}" title="${esc(n.article.title||"")}">${esc(shortCite(n))}</button>`;
  });
  return {html, used};
}

/* Everything the reader has read, for the idea chat to draw connections from */
function readPapers(trail){
  return Object.values(trail.nodes)
    .filter(n => n.kind==="article" && n.detail)
    .sort((a,b)=>a.created-b.created)
    .map((n,i)=>({ key:"P"+(i+1), node:n }));
}
/* What they said to Scout while reading — the other half of their thinking */
function scoutBlock(trail, cap){
  const chat = (trail && trail.chat) || [];
  const limit = cap === undefined ? 6500 : cap;
  if(!limit) return "(left out to keep this message short)";
  if(!chat.length) return "(they haven't talked to Scout while reading)";
  const lines = chat.map(m => {
    if(m.role === "user") return "Them: " + m.content;
    let who = "Scout";
    if(m.jump && m.jump.label) who = `Scout (answering from "${m.jump.label}")`;
    else if(m.meta) who = "Scout (about how the app works)";
    let t = who + ": " + m.content;
    if(m.options && m.options.length){
      const picked = (m.chosen !== null && m.chosen >= 0) ? m.options[m.chosen] : null;
      t += "\n  [offered: " + m.options.map(o=>`"${o.title}"`).join("; ") + (picked ? `; they opened "${picked.title}"` : "; they opened none") + "]";
    }
    return t;
  });
  let out = lines.join("\n");
  if(out.length > limit) out = "…(earlier part trimmed)…\n" + out.slice(-limit);
  return out;
}
function papersBlock(trail, cap){
  let list = readPapers(trail);
  if(!list.length) return "(they haven't finished reading anything yet)";
  let note = "";
  if(cap && list.length > cap){ note = `(showing the ${cap} most recent of ${list.length})\n`; list = list.slice(-cap); }
  return note + list.map(({key,node}) => {
    const a = node.article, d = node.detail;
    return `[${key}] "${a.title}" (${a.authors||"?"}, ${a.year||"n.d."}) — ${d.keyFinding||""}`
      + ((d.limitations||[]).length ? ` | can't yet: ${d.limitations.map(L=>L.name).join("; ")}` : "");
  }).join("\n");
}

2. COLLECT QUIETLY. As they talk, you are filling in five things about their idea: the question, what they'd measure, compared to what, what would prove them wrong, and how they'd do it. Pick these up from whatever they happen to say — a good answer is often buried in a message about something else. Capture silently; don't announce it or read it back to them.

3. NUDGE, SOMETIMES. When the conversation has room for it — they asked nothing, or you've answered them fully and the exchange has a natural pause — add one question that moves an empty slot forward. Roughly every second or third message, not every one. Never tack a question onto the end out of obligation; a reply that just answers well is fine. If they ignore a question you asked, let it go and pick it up later.

/* Open a paper the idea chat named, as a branch of the trail */
function openIdeaPaper(idea, mi, pi){
  const trail = trailOfIdea(idea); if(!trail) return;
  const m = idea.chat[mi], rec = m && m.papers && m.papers[pi]; if(!rec) return;
  const dup = Object.values(trail.nodes).find(n => n.kind==="article" && n.article.title.toLowerCase()===rec.title.toLowerCase());
  let target = dup;
  if(!target){
    const parent = trail.nodes[idea.srcNodeId] || trail.nodes[trail.rootId];
    target = {id:uid(), parentId:parent.id, kind:"article", origin:"idea", question:idea.title, created:Date.now(),
      article:{title:rec.title, authors:rec.authors, year:rec.year, venue:rec.venue, preprint:rec.preprint,
        headline:rec.headline, kind:rec.kind, angle:rec.angle, tags:rec.tags, venueType:rec.venueType, peerGuess:rec.peerGuess},
      detail:null, candidates:null, returnTo:{nodeId:trail.cur.nodeId, mode:trail.cur.mode}};
    trail.nodes[target.id] = target;
    bumpTags(trail, rec.tags, 1);
  }
  rec.opened = true;
  if(!idea.linked.includes(target.id)) idea.linked.push(target.id);
  app.trailId = trail.id; app.view = "trail"; app.citedOpen = false; app.ideaReturn = idea.id;
  trail.cur = {nodeId:target.id, mode:"read"};
  save(); render(); window.scrollTo({top:0});
  if(!target.detail) loadDetail(trail, target);
}

/* Leave the board to go read, with a way back */
function exploreForIdea(idea, topic){
  const trail = trailOfIdea(idea); if(!trail) return;
  app.trailId = trail.id;

  trail.nodes[node.id] = node;

/* ---------- The idea write-up ---------- */
function ideaRefs(idea, trail){
  const ids = [];
  if(idea.srcNodeId) ids.push(idea.srcNodeId);
  (idea.linked||[]).forEach(id => { if(!ids.includes(id)) ids.push(id); });
  return ids.map(id => trail && trail.nodes[id]).filter(n => n && n.detail);
}
async function buildIdeaDoc(idea){
  const trail = trailOfIdea(idea); if(!trail) return;
  if(busy.doc && busy.doc.loading) return;
  busy.doc = {loading:true, msg: idea.doc ? "Updating your write-up…" : "Writing it up…"}; render();
  const f = fieldById(trail.field);
  const src = trail.nodes[idea.srcNodeId];
  const filled = SLOTS.map(([k,label]) => `${label}: ${idea.slots[k] || "(they haven't answered this yet)"}`).join("\n");
  const refs = ideaRefs(idea, trail);
  const DTIERS = [{convo:9000, scout:5000, papers:0}, {convo:5000, scout:2000, papers:12}, {convo:3000, scout:0, papers:6}];
  const make = lvl => {
  const T = DTIERS[Math.min(lvl, DTIERS.length-1)];
  const convo = (idea.chat||[]).map(m => (m.role==="user"?"Them: ":"Scout: ") + m.content).join("\n").slice(-T.convo);
  return `Write up a student's own research idea as a short proposal they could hand to a teacher, a science fair judge, a competition, or a professor they want to work with. Field: ${f.name}. Their wider topic: "${trail.topic}".

THE GAP THEY CLAIMED: "${idea.title}"${idea.gap ? " — " + idea.gap : ""}
${src ? `It came from: "${src.article.title}" (${src.article.authors||"?"}, ${src.article.year||"n.d."})` : ""}

WHAT THEY HAVE ANSWERED:
${filled}

PAPERS THEY HAVE READ:
${papersBlock(trail, T.papers)}

WHAT THEY ASKED SCOUT WHILE READING (their thinking as they went through the papers — use it for background and for what they already ruled out):
${scoutBlock(trail, T.scout)}

THEIR WHOLE CONVERSATION ABOUT THIS IDEA (the main source — their reasoning, what they ruled out, what they still wonder):
${convo || "(no conversation yet)"}

Rules:
- Everything in this document must come from what they said, what they answered, or the papers listed above. Invent nothing. No made-up numbers, no results they have not got, no papers not listed.
- It is THEIR idea, written in their voice as a proposal — third person about the work, not a chat transcript and not a report about them. Never write "the student" or "they"; write about the question and the plan.
- Where they have not answered something, say plainly what is still open rather than filling it in. An honest gap is worth more than a confident guess.
- Clear and specific, the way a good undergraduate proposal reads. Short sentences. Define a technical term the first time it appears. No filler, no "in conclusion", no restating the heading in the first line of a section.
- Sections, in this order, skipping any you genuinely have nothing for: Background (what's already known, citing the papers they read), The gap, The question, What would be measured, How it would be done, What would show the idea is wrong, What it would take (equipment, data, skills, time — only if the conversation touched it), Still open.
- Each section is 1-3 short paragraphs. The whole thing is 400-700 words.
- When a point rests on a paper they read, name it inline with its key in square brackets, like [P2]. Only keys from the list above.

Reply with only a JSON object:
{"title": string (a specific title for the idea, max 12 words, not the limitation's name reworded),
 "oneLine": string (one sentence a reader could repeat to someone else),
 "sections": [{"heading": string, "body": string (plain text, paragraphs separated by \\n\\n)}]}`;
  };
  try{
    const r = await askFitted(make, {cache:false}, 3);
    const d = Array.isArray(r) ? r[0] : r;
    const secs = (Array.isArray(d && d.sections) ? d.sections : []).filter(x=>x && x.heading && x.body)
      .map(x=>({heading:String(x.heading), body:String(x.body)}));
    if(!secs.length) throw {code:"invalid_json"};
    idea.doc = { title:String((d && d.title) || idea.title), oneLine:String((d && d.oneLine)||""),
      sections:secs, updated:Date.now(), fromMessages:(idea.chat||[]).length,
      refs: refs.map(n=>n.id) };
    busy.doc = null; save(); render();
  }catch(e){ busy.doc = {error: errCopy(e)}; render(); }
}
function ideaDocText(idea, trail){
  const d = idea.doc; if(!d) return "";
  const pmap = {}; readPapers(trail).forEach(({key,node}) => { pmap[key] = node; });
  const plain = t => String(t).replace(/\s*\[(P\d+)\]/g, (m,k)=> pmap[k] ? ` (${shortCite(pmap[k])})` : "");
  const refs = (d.refs||[]).map(id=>trail.nodes[id]).filter(Boolean);
  return d.title + "\n\n" + (d.oneLine ? plain(d.oneLine) + "\n\n" : "")
    + d.sections.map(s => s.heading + "\n" + plain(s.body)).join("\n\n")
    + (refs.length ? "\n\nReferences\n" + refs.map(n=>segText(formatCite(n, citeStyle()))).join("\n") : "");
}
async function downloadIdeaDoc(idea, fmt){
  const trail = trailOfIdea(idea); const d = idea.doc; if(!trail || !d) return;
  const pmap = {}; readPapers(trail).forEach(({key,node}) => { pmap[key] = node; });
  const plain = t => String(t).replace(/\s*\[(P\d+)\]/g, (m,k)=> pmap[k] ? ` (${shortCite(pmap[k])})` : "");
  const refs = (d.refs||[]).map(id=>trail.nodes[id]).filter(Boolean);
  const base = "idea-" + slug(d.title || idea.title);
  busy.docdl = {msg:"Waiting for you to confirm the download…"}; render();
  try{
    if(fmt==="txt"){
      const dl = await dlPromise; if(!dl) throw {code:"unavailable"};
      await dl.save({filename: base + ".txt", data: ideaDocText(idea, trail)});
    } else {
      const blocks = [{h:1, t:d.title}];
      if(d.oneLine) blocks.push({t:plain(d.oneLine), i:true});
      d.sections.forEach(s => {
        blocks.push({h:2, t:s.heading});
        plain(s.body).split(/\n{2,}/).forEach(para => { if(para.trim()) blocks.push({t:para.trim()}); });
      });
      if(refs.length){
        blocks.push({h:2, t:"References"});
        refs.forEach(n => blocks.push({segs: formatCite(n, citeStyle()), hang:true}));
      }
      const dl = await dlPromise; if(!dl) throw {code:"unavailable"};
      await dl.save({filename: base + ".docx", data: buildProseDocx(blocks)});
    }
    busy.docdl = {msg:"Downloaded."};
  }catch(e){
    if(e && e.code==="declined") busy.docdl = {msg:"Download canceled."};
    else {
      try{ await navigator.clipboard.writeText(ideaDocText(idea, trail)); busy.docdl = {msg:"Downloads aren't available here, so the write-up was copied to your clipboard."}; }
      catch(e2){ busy.docdl = {msg:"Couldn't save or copy it here.", err:true}; }
    }
  }
  render();
}
async function copyIdeaDoc(idea){
  const trail = trailOfIdea(idea); if(!trail) return;
  try{ await navigator.clipboard.writeText(ideaDocText(idea, trail)); busy.docdl = {msg:"Copied the write-up."}; }
  catch(e){ busy.docdl = {msg:"Couldn't reach the clipboard.", err:true}; }
  render();
}
/* A Word file of headings and paragraphs */
function buildProseDocx(blocks){
  const x = t => String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const font = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
  const run = (t, o) => `<w:r><w:rPr>${font}${o&&o.b?"<w:b/>":""}${o&&o.i?"<w:i/>":""}<w:sz w:val="${o&&o.sz||24}"/></w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  const body = blocks.map(bl => {
    if(bl.segs){
      return `<w:p><w:pPr><w:spacing w:before="0" w:after="120" w:line="360" w:lineRule="auto"/><w:ind w:left="720" w:hanging="720"/></w:pPr>${bl.segs.map(sg=>run(sg.t,{i:sg.i})).join("")}</w:p>`;
    }
    const h = bl.h || 0;
    const sp = h===1 ? 'w:before="0" w:after="160"' : h===2 ? 'w:before="280" w:after="100"' : 'w:before="0" w:after="160"';
    const jc = h===1 ? '<w:jc w:val="center"/>' : "";
    return `<w:p><w:pPr>${jc}<w:spacing ${sp} w:line="360" w:lineRule="auto"/></w:pPr>${run(bl.t,{b:h>0, i:bl.i, sz: h===1?32:h===2?26:24})}</w:p>`;
  }).join("");
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  return zipStore([
    ["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ["word/document.xml", doc]
  ]);
}

function peerBadge(node, big){
  const p = peerOf(node), a = node.article || {};
  const cls = p.k==="yes" ? "ok" : p.k==="no" ? "warn" : p.k==="retracted" ? "bad" : "mute";
  const icon = p.k==="yes" ? "✓" : p.k==="no" ? "◷" : p.k==="retracted" ? "✕" : "?";
  const sure = a.peer ? "" : " guess";
  const extra = [];
  if(typeof a.citedBy === "number") extra.push(`<span class="vb">Cited by ${a.citedBy.toLocaleString()}</span>`);
  const miss = node.verified === false || (node.verified && node.verified.found === false);
  if(miss) extra.push(`<span class="vb miss">Not found in the database</span>`);
  return `<span class="pb ${cls}${sure}" title="${esc(a.peer ? "Confirmed by a live database lookup" : "Based on the venue Claude identified. This page can't reach a database to confirm it, so check the publisher.")}">${icon} ${esc(p.label)}${a.peer?"":" (unconfirmed)"}</span>${extra.join("")}`;
}

function renderRead(trail, node){
  const a = node.article, d = node.detail, b = busy[node.id+":d"];
  const back = node.returnTo && trail.nodes[node.returnTo.nodeId];
  const backLabel = (node.origin==="chat"||node.origin==="limitation"||node.origin==="idea") ? "Go back to where you were" : "Not for me, go back";
  let body;
  if(d){
    let summ = Array.isArray(d.summary) ? d.summary : [String(d.summary)];
    // A note belongs beside the summary, not inside it — lift one out of older articles too
    const notes = [];
    if(d.note) notes.push(d.note);
    const META = /\b(I|I'm|my|me|the title given|this summary|the record|does not match|doesn't match|cannot identify|can't identify|could not identify|as far as I|I believe|I know|I recall|unsure|not certain|appears to be a different)\b/i;
    const NOTE_LEAD = /^\s*(Note that|Note|Caveat|Important)\b[:,]?\s*/i;
    summ = summ.map(para => {
      let t = String(para||"").trim();
      if(!NOTE_LEAD.test(t) && !/\s(Note|Caveat)\b[:,]/.test(t)) return t;
      // split into sentences, then peel off the meta ones and keep the rest as prose
      const parts = t.split(/(?<=[.!?])\s+/);
      const keep = [];
      let peeling = NOTE_LEAD.test(t);
      for(let sent of parts){
        const lead = NOTE_LEAD.test(sent);
        if(lead) peeling = true;
        const bare = sent.replace(NOTE_LEAD, "").trim();
        if(peeling && (lead || META.test(bare))){ if(bare) notes.push(bare); continue; }
        peeling = false;
        keep.push(sent);
      }
      return keep.join(" ").trim();
    }).filter(t => t);
    termMap = buildTermMap(d, a);
    const used = new Set();
    summ.forEach(p => markup(p, termMap, used, false));
    const missing = (d.terms||[]).map(t=>termKey(t.term)).filter(k=>termMap[k] && !used.has(k));
    used.clear();
    const hasLesson = !!(d.lessonIntro || (d.connections||[]).length || missing.length || (d.buildsOn||[]).length);
    const linkTerm = w => { const k = lookupTerm(w, termMap); return k ? termSpan(w, k, termMap) : `<b>${esc(w)}</b>`; };
    body = `
      <h2>What the paper found</h2>
      ${notes.length ? `<div class="pnote"><span class="pnote-k">About this record</span>${notes.map(n=>`<p>${esc(n.replace(/\[\[|\]\]/g,""))}</p>`).join("")}</div>` : ""}
      ${Object.keys(termMap).length ? `<p class="term-hint"><span class="term demo">Colored words</span> are the crash course. ${canHover ? "Hover over or click" : "Tap"} one to see what it means.</p>` : ""}
      ${summ.length ? `<div class="prose">${summ.map(p=>`<p>${markup(p, termMap, used, false)}</p>`).join("")}</div>` : ""}
      ${d.keyFinding?`<p class="finding">${markup(d.keyFinding, termMap, new Set(), true)}</p>`:""}
      ${hasLesson ? `<h2>How these words fit together</h2>
      <div class="lesson">
        ${d.lessonIntro?`<p class="intro">${markup(d.lessonIntro, termMap, new Set(), true)}</p>`:""}
        ${(d.connections||[]).length ? `<ul class="links">${d.connections.map(c=>`<li>${linkTerm(c.from)} and ${linkTerm(c.to)}: ${esc(c.how)}</li>`).join("")}</ul>`:""}
        ${missing.length ? `<p class="known">More words from this paper: ${missing.map(k=>termSpan(termMap[k].term, k, termMap)).join(", ")}</p>`:""}
        ${(d.buildsOn||[]).length ? `<p class="known">Builds on words you already learned: ${d.buildsOn.map(x=>{ const k = lookupTerm(x, termMap); return k ? termSpan(x, k, termMap) : esc(x); }).join(", ")}</p>`:""}
      </div>` : ""}
      ${(d.limitations||[]).length ? `<h2>Limitations of this work</h2>
      <ul class="lims">${d.limitations.map((L,i)=>`<li><button class="lim" data-act="lim" data-id="${node.id}" data-i="${i}"><span class="lim-name">${esc(L.name)}</span><span class="lim-go">What's being done →</span></button></li>`).join("")}</ul>` : ""}
      ${(()=>{ const L = sourceLink(node); return `<div class="orig">
        <a class="btn primary" href="${esc(L.url)}" target="_blank" rel="noopener">Open the original article
          <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4h9v9M16 4 6 14M13 16H4V7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        ${L.direct ? `<a class="btn" href="${esc(scholar(a))}" target="_blank" rel="noopener">Search Google Scholar</a>` : ""}
        <span class="orig-note">${esc(L.note)}</span>
      </div>`; })()}
      <p class="fineprint">Written by Claude from what it knows about this paper, not copied from it — it has no live access to the text, so open the original before relying on any specific number.</p>`;
  } else if(b && b.error){
    body = `<p class="err">${esc(b.error)}</p><button class="btn" data-act="retrydetail">Try again</button>`;
  } else {
    body = `<p class="status">Reading the paper and preparing your crash course…</p>` + "<div class='skel' style='height:160px'></div><div class='skel' style='height:260px'></div>";
  }
  return `<article class="read">
    <div class="crumb">${back?`<button class="link" data-act="back">${(node.origin==="chat"||node.origin==="limitation"||node.origin==="idea")?"Back to where you were":"Back to the five articles"}</button>`:""}</div>
    ${node.question?`<p class="status">${node.origin==="idea"?"Opened while working on your idea:":node.origin==="limitation"?"Opened as follow-up:":"Opened to answer:"} “${esc(node.question)}”</p>`:""}
    <div class="read-badges">${a.year?`<span class="read-year">Published ${esc(a.year)}</span>`:""}${peerBadge(node)}</div><div class="angle">${a.kind?`<span class="kind">${esc(a.kind)}</span>`:""}${esc(a.angle||"")}</div>
    <h1>${esc(a.headline || a.title)}</h1>
    ${node.article.retracted?`<p class="retract">This paper has been retracted. Treat anything in it with caution and don't cite it as a finding.</p>`:""}
    <div class="meta"><cite>${esc(a.title)}</cite><br>${esc(a.authors||"")}${a.year?`, ${esc(a.year)}`:""}${a.venue?`. ${esc(a.venue)}`:""}</div>
    ${d ? `<p class="cite-note">${node.cited!==false ? `In your works cited. <button class="link" data-act="citetoggle" data-id="${node.id}">Remove</button> <button class="link" data-act="cited">View list</button>` : `Not in your works cited. <button class="link" data-act="citetoggle" data-id="${node.id}">Add it</button>`}</p>` : ""}
    ${body}
    <div class="stickyact actions">
      ${d ? `<a class="btn" href="${esc(sourceLink(node).url)}" target="_blank" rel="noopener">Open original</a>` : ""}
      <button class="btn" data-act="back">${backLabel}</button>
      <button class="btn primary" data-act="deeper" ${d?"":"disabled"}>I like it, go deeper</button>
    </div>
  </article>`;
}

function renderChat(trail){
  const sugg = trail.cur.mode==="read"
    ? ["How exactly did they test this?", "What numbers did they actually report?", "Why hasn't this been done before?", "Who disagrees with this paper?"]
    : ["Which of these is best for a beginner?", "What's the big open question in this topic?"];
  const log = trail.chat.map((m,i)=>{
    if(m.role==="user") return `<div class="msg u">${esc(m.content)}</div>`;
    let src = "";
    if(m.jump){
      const j = m.jump, exists = !!trail.nodes[j.nodeId];
      src = `<div class="src${j.undone?" undone":""}"><span class="src-k">${j.undone?"Source removed":(j.reused?"Answered from your trail":"Source")}</span><span class="src-t">“${esc(j.label)}”</span>${j.why?`<span class="src-why">${esc(j.why)}</span>`:""}${(j.considered||[]).length && !j.undone ? `<details class="src-also"><summary>Also considered ${j.considered.length}</summary>${j.considered.map(c=>`<div><b>${esc(c.title)}</b>${c.year?` (${esc(c.year)})`:""}${c.why?`. ${esc(c.why)}`:""}</div>`).join("")}</details>` : ""}
        <span class="src-acts">${exists && !j.undone ? `<button class="link" data-act="srcopen" data-id="${j.nodeId}">Open paper</button>` : ""}${j.moved!==false && !j.undone ? `<button class="link" data-act="undo" data-i="${i}">Undo, go back</button>` : ""}</span></div>`;
    }
    let opts = "";
    if(m.options && m.options.length){
      const busyNow = !!(busy.chat && busy.chat.loading);
      const n = m.options.length;
      const done = m.chosen !== null && m.chosen >= 0;
      const at = done ? m.chosen : Math.min(Math.max(m.view||0, 0), n-1);
      const o = m.options[at];
      const card = `<button class="opt${done?" picked":""}" data-act="pickopt" data-mi="${i}" data-j="${at}" ${done||busyNow?"disabled":""}>
          <span class="opt-hl">${esc(o.headline)}</span>
          <span class="opt-meta">${o.year?`<span class="opt-year">${esc(o.year)}</span>`:""}${peerBadge({article:o})}</span>
          ${o.venue?`<span class="opt-venue">${esc(o.venue)}</span>`:""}
          ${o.why?`<span class="opt-why">${esc(o.why)}</span>`:""}
          <span class="${done?"opt-tag":"opt-go"}">${done?"You opened this":"Open and answer →"}</span>
        </button>`;
      const nav = (n>1 && !done) ? `<div class="opt-nav">
          <button class="opt-arrow" data-act="optnav" data-mi="${i}" data-d="-1" ${at===0?"disabled":""} aria-label="Previous paper">‹</button>
          <span class="opt-count">${at+1} of ${n}</span>
          <button class="opt-arrow" data-act="optnav" data-mi="${i}" data-d="1" ${at===n-1?"disabled":""} aria-label="Next paper">›</button>
        </div>` : "";
      const dots = (n>1 && !done) ? `<div class="opt-dots">${m.options.map((_,k)=>`<button class="dot${k===at?" on":""}" data-act="optgo" data-mi="${i}" data-j="${k}" aria-label="Paper ${k+1}"></button>`).join("")}</div>` : "";
      opts = `${m.optLead && !done ? `<div class="opt-lead">${esc(m.optLead)}</div>` : ""}
        <div class="opts">${nav}${card}${dots}</div>
        ${!done && !busyNow ? `<div class="opt-alt"><button class="link" data-act="moreopts" data-mi="${i}">None of these, find others</button></div>` : ""}`;
    }
    return `<div class="msg a${m.noSource?" nosrc":""}${m.options?" haspts":""}">${esc(m.content)}${opts}${src}</div>`;
  }).join("");
  const b = busy.chat;
  return `<div class="chat-head"><div><h2>${GUIDE}</h2><div class="chat-sub">Your trail guide. Every answer comes from a paper.</div></div><button class="link chat-close" data-act="closechat">Close</button></div>
    <div class="chat-log" aria-live="polite">
      ${trail.chat.length ? log : `<div class="chat-empty">Ask ${GUIDE} anything. ${GUIDE} answers from a real paper — the one you're reading, going deeper than the summary on screen, or a new one it finds when yours can't answer you. Any new paper joins your trail and your works cited, and you can always undo.
        <div class="suggest">${sugg.map(q=>`<button data-act="suggest">${esc(q)}</button>`).join("")}</div></div>`}
      ${b && b.loading && b.streaming!==undefined ? `<div class="msg a" id="scout-stream">${esc(b.streaming)}</div>` : ""}
      ${b && b.loading && b.status ? `<div class="msg a working" id="scout-status">${esc(b.status)}</div>`:""}
      ${b && b.error ? `<p class="err">${esc(b.error)}</p>`:""}
    </div>
    <form class="chat-form" data-form="chat">
      <textarea name="q" rows="1" placeholder="Ask ${GUIDE} a question" aria-label="Your question for ${GUIDE}"></textarea>
      <button class="btn primary" type="submit" ${b&&b.loading?"disabled":""}>Ask</button>
    </form>`;
}


function renderCited(trail){
  const style = citeStyle();
  const inc = sortedCited(trail);
  const exc = Object.values(trail.nodes).filter(n => n.kind==="article" && n.detail && n.cited === false);
  const entry = (n, on) => `<li class="cite${on?"":" off"}"><div class="cite-text">${segHTML(formatCite(n, style))}</div>
    <div class="cite-acts"><button class="link" data-act="citetoggle" data-id="${n.id}">${on?"Remove":"Add back"}</button><button class="link" data-act="jump" data-id="${n.id}">Open article</button><a class="link" href="${esc(scholar(n.article))}" target="_blank" rel="noopener">Check on Google Scholar</a></div></li>`;
  const dl = busy.dl;
  return `
  <h1 class="pick-title">Works cited</h1>
  <p class="pick-sub">Every article you open on this trail is added here automatically, formatted and sorted. Remove any you didn't use.</p>
  <div class="seg" role="group" aria-label="Citation style">${Object.entries(STYLES).map(([k,v])=>`<button class="${k===style?"on":""}" aria-pressed="${k===style}" data-act="citestyle" data-style="${k}">${v.label}</button>`).join("")}</div>
  ${inc.length ? `<h2 class="cite-heading">${STYLES[style].heading}</h2><ol class="cites">${inc.map(n=>entry(n,true)).join("")}</ol>` : `<p class="status">No sources yet. Open an article and it will show up here.</p>`}
  <div class="actions">
    ${dlState!=="off" ? `<button class="btn primary" data-act="dl" data-fmt="docx" ${inc.length?"":"disabled"}>Download Word document</button>
    <button class="btn" data-act="dl" data-fmt="txt" ${inc.length?"":"disabled"}>Download text</button>
    <button class="btn" data-act="dl" data-fmt="bib" ${inc.length?"":"disabled"}>Download BibTeX</button>` : ""}
    <button class="btn" data-act="copycite" ${inc.length?"":"disabled"}>Copy all</button>
  </div>
  <div class="actions" style="margin-top:28px"><button class="btn primary back-btn" data-act="citeclose"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to your research</button></div>
  ${dl ? `<p class="${dl.err?"err":"status"}">${esc(dl.msg)}</p>` : ""}
  ${exc.length ? `<h2 class="cite-heading" style="margin-top:36px">Not included</h2><ol class="cites">${exc.map(n=>entry(n,false)).join("")}</ol>` : ""}
  <p class="fineprint">Entries for papers found in the live lookup use that database's real author list, DOI, volume and pages. Where the lookup didn't reach or didn't find the paper, those details come from Claude's knowledge and are left out when it isn't sure. Check each entry against the paper before you hand it in.</p>`;
}


function renderIdeaDoc(idea, trail, pmap){
  const d = idea.doc, b = busy.doc, dl = busy.docdl;
  const filledN = SLOTS.filter(([k])=>idea.slots[k]).length;
  const chip = t => String(t).replace(/\s*\[(P\d+)\]/g, (m,k)=>{
    const n = pmap[k]; if(!n) return "";
    return ` <button class="paperchip" data-act="ideajump" data-id="${n.id}" title="${esc(n.article.title||"")}">${esc(shortCite(n))}</button>`;
  });
  const para = t => String(t).split(/\n{2,}/).filter(x=>x.trim()).map(x=>`<p>${chip(esc(x.trim()))}</p>`).join("");
  if(!d){
    return `<section class="writeup empty">
      <h2 class="writeup-h">The write-up</h2>
      <p class="writeup-p">When the five boxes are answered, this becomes a short proposal you could hand to a teacher, a judge, or a professor \u2014 built only from what you've said and the papers you've read. ${filledN<SLOTS.length?`${SLOTS.length-filledN} to go, but you can start it early.`:""}</p>
      <div class="actions">
        <button class="btn primary" data-act="builddoc" ${b&&b.loading?"disabled":""}>${b&&b.loading?esc(b.msg||"Writing\u2026"):"Write it up"}</button>
      </div>
      ${b&&b.error?`<p class="err">${esc(b.error)}</p>`:""}
    </section>`;
  }
  const behind = (idea.chat||[]).length - (d.fromMessages||0);
  const refs = (d.refs||[]).map(id=>trail.nodes[id]).filter(Boolean);
  return `<section class="writeup">
    <div class="writeup-bar">
      <h2 class="writeup-h">The write-up</h2>
      <div class="writeup-acts">
        ${behind>0?`<span class="behind">${behind} new message${behind===1?"":"s"} since this was written</span>`:""}
        <button class="btn${behind>0?" primary":""}" data-act="builddoc" ${b&&b.loading?"disabled":""}>${b&&b.loading?esc(b.msg||"Updating\u2026"):"Update"}</button>
        ${dlState!=="off"?`<button class="btn" data-act="dldoc" data-fmt="docx">Download Word</button>`:""}
        <button class="btn" data-act="copydoc">Copy</button>
      </div>
    </div>
    ${b&&b.error?`<p class="err">${esc(b.error)}</p>`:""}
    ${dl?`<p class="${dl.err?"err":"status"}">${esc(dl.msg)}</p>`:""}
    <article class="paper">
      <h1>${esc(d.title)}</h1>
      ${d.oneLine?`<p class="paper-lede">${chip(esc(d.oneLine))}</p>`:""}
      ${d.sections.map(x=>`<h2>${esc(x.heading)}</h2>${para(x.body)}`).join("")}
      ${refs.length?`<h2>References</h2><ol class="cites">${refs.map(n=>`<li class="cite"><div class="cite-text">${segHTML(formatCite(n, citeStyle()))}</div></li>`).join("")}</ol>`:""}
    </article>
    <p class="fineprint">Written from your answers, your conversation, and the papers on your trail. Check every citation against the original before you hand this in.</p>
  </section>`;
}

function renderBoardPage(){
  const idea = app.ideaId ? ideaById(app.ideaId) : null;
  return topbar(`<button class="btn primary back-btn" data-act="boardclose"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to your research</button>`)
    + `<main class="boardpage">${idea ? renderIdea(idea) : renderBoardList()}</main>`;
}

function renderBoardList(){
  const ideas = allIdeas();
  const groups = [];
  ideas.forEach(x => {
    let g = groups.find(y => y.trailId === x.trailId);
    if(!g){ g = {trailId:x.trailId, topic:x.trailTopic || "Earlier research", field:x.field, items:[]}; groups.push(g); }
    g.items.push(x);
  });
  return `<h1 class="pick-title">Your ideas</h1>
  <p class="pick-sub">Every limitation you claim lands here and stays, across every topic you explore. Open one and Scout asks the questions that turn it into something you could test.</p>
  ${groups.length ? groups.map(g=>`
    <section class="ideagroup">
      <h2 class="ideagroup-h">${esc(g.topic)}${g.field && fieldById(g.field) ? ` <span class="ideagroup-f">${esc(fieldById(g.field).name)}</span>` : ""}</h2>
      <ul class="ideas">${g.items.map(x=>{
        const t = trailOfIdea(x), src = t && t.nodes[x.srcNodeId];
        const done = SLOTS.filter(([k])=>x.slots[k]).length;
        const msgs = (x.chat||[]).filter(m=>m.role==="user").length;
        return `<li><button class="ideacard" data-act="openidea" data-id="${x.id}">
          <span class="ideacard-t">${esc(x.title)}</span>
          <span class="ideacard-m">${done} of ${SLOTS.length} answered${msgs?` \u00b7 ${msgs} message${msgs===1?"":"s"}`:""}${src?` \u00b7 from \u201c${esc(src.article.headline||src.article.title)}\u201d`:""}</span>
          <span class="ideabar"><span style="width:${Math.round(done/SLOTS.length*100)}%"></span></span>
        </button></li>`;
      }).join("")}</ul>
    </section>`).join("")
   : `<p class="status">Nothing here yet. Open a paper, read what it can't do, and press \u201cI want to work on this\u201d on one of its limitations.</p>`}`;
}

function renderIdea(idea){
  const trail = trailOfIdea(idea);
  const src = trail && trail.nodes[idea.srcNodeId];
  const b = busy.idea;
  const lastExplore = [...idea.chat].reverse().find(m=>m.explore && !m.exploreUsed);
  const pmap = {}; readPapers(trail).forEach(({key,node}) => { pmap[key] = node; });
  const log = idea.chat.map((m,i)=>{
    if(m.role==="user") return `<div class="msg u">${esc(m.content)}</div>`;
    const {html, used} = linkKeys(m.content, pmap);
    let x = "";
    if(m.captured){
      const keys = Array.isArray(m.captured) ? m.captured : [m.captured];
      const labs = keys.map(k => (SLOTS.find(([kk])=>kk===k)||[null,k])[1]);
      if(labs.length) x += `<div class="cap">Saved to <b>${labs.map(esc).join("</b>, <b>")}</b></div>`;
    }
    // the callout only earns its place when it says more than the inline citation did
    if(m.link && m.link.what && !used.has(m.link.nodeId)){
      const n = trail && trail.nodes[m.link.nodeId];
      x += `<div class="src"><span class="src-k">Already in what you've read</span><span class="src-t">${n?esc(shortCite(n))+" \u00b7 ":""}\u201c${esc(m.link.label)}\u201d</span><span class="src-why">${esc(m.link.what)}</span><span class="src-acts"><button class="link" data-act="ideajump" data-id="${m.link.nodeId}">Open that paper</button></span></div>`;
    }
    if(m.papers && m.papers.length){
      x += `<div class="recs"><span class="src-k">Papers worth opening</span>${m.papers.map((o,j)=>`
        <button class="rec" data-act="ideapaper" data-mi="${i}" data-j="${j}">
          <span class="rec-top">${o.year?`<span class="rec-cite">${esc(String(o.authors||"").split(/,| and | & /)[0].replace(/\s*et al\.?$/i,"").trim().split(/\s+/).pop()||"")} ${esc(o.year)}</span>`:""}${peerBadge({article:o})}</span>
          <span class="rec-hl">${esc(o.headline)}</span>
          ${o.venue?`<span class="rec-venue">${esc(o.venue)}</span>`:""}
          ${o.why?`<span class="rec-why">${esc(o.why)}</span>`:""}
          <span class="rec-go">${o.opened?"Opened \u00b7 open again":"Open and add to my trail \u2192"}</span>
        </button>`).join("")}</div>`;
    }
    if(m.explore) x += `<div class="exp"><span class="src-k">Worth reading up on</span><span class="src-t">${esc(m.explore.topic)}</span>${m.explore.why?`<span class="src-why">${esc(m.explore.why)}</span>`:""}<span class="src-acts"><button class="link" data-act="explore" data-i="${i}">Keep exploring \u2192</button></span></div>`;
    return `<div class="msg a">${html}${x}</div>`;
  }).join("");
  const scouted = ((trail && trail.chat) || []).some(m => m.role === "user");
  const starters = (scouted ? ["Let's use the idea I was discussing with Scout"] : [])
    .concat(["I'm not sure where to start", "Why hasn't anyone fixed this?", "Here's what I'd try:"]);
  return `<div class="crumb"><button class="link" data-act="boardlist">\u2190 All your ideas</button>${idea.trailTopic?`<span class="idea-trail">From your work on ${esc(idea.trailTopic)}</span>`:""}</div>
  <div class="idea-wrap">
    <div class="idea-main">
      <div class="idea-k">Your idea</div>
      <h1 class="idea-h">${esc(idea.title)}</h1>
      ${idea.gap?`<p class="idea-gap">${esc(idea.gap)}</p>`:""}
      ${src?`<p class="idea-src">You claimed this from \u201c${esc(src.article.headline||src.article.title)}\u201d. <button class="link" data-act="ideajump" data-id="${src.id}">Reread it</button></p>`:""}
      <div class="idea-chat">
        <div class="idea-log" aria-live="polite">
          ${idea.chat.length ? log : `<div class="chat-empty">Tell Scout what you're thinking, even if it's half-formed. Ask it anything: it answers properly, points you to papers you've read that bear on it, and can name new ones worth opening. It can also see everything you asked Scout while reading, so if you were already circling an idea over there, just say so and it'll pick the thread up.
            <div class="suggest">${starters.map(q=>`<button data-act="ideasuggest">${esc(q)}</button>`).join("")}</div></div>`}
          ${b && b.loading ? `<div class="msg a working">Thinking\u2026</div>`:""}
          ${b && b.error ? `<p class="err">${esc(b.error)}</p>`:""}
        </div>
        <form class="chat-form" data-form="idea">
          <textarea name="iq" rows="1" placeholder="What are you thinking?" aria-label="Your message"></textarea>
          <button class="btn primary" type="submit" ${b&&b.loading?"disabled":""}>Send</button>
        </form>
      </div>
    </div>
    <aside class="idea-side">
      <div class="slots-h">The idea so far</div>
      <dl class="slots">${SLOTS.map(([k,label])=>`<div class="${idea.slots[k]?"on":""}"><dt>${esc(label)}</dt><dd>${idea.slots[k]?esc(idea.slots[k]):"<span class='slot-empty'>not yet</span>"}</dd></div>`).join("")}</dl>
      ${idea.linked.length?`<div class="slots-h" style="margin-top:22px">Papers it rests on</div>
        <ul class="idea-links">${idea.linked.map(id=>{const n=trail&&trail.nodes[id]; return n?`<li><button class="link" data-act="ideajump" data-id="${id}"><b>${esc(shortCite(n))}</b> ${esc(n.article.headline||n.article.title)}</button></li>`:"";}).join("")}</ul>`:""}
      ${lastExplore?`<div class="actions"><button class="btn" data-act="explore" data-i="${idea.chat.indexOf(lastExplore)}">Keep exploring</button></div>`:""}
    </aside>
  </div>
  ${renderIdeaDoc(idea, trail, pmap)}`;
}

function renderTrail(){
  const trail = curTrail(); if(!trail){ app.view="home"; return renderHome(); }
  const node = trail.nodes[trail.cur.nodeId] || trail.nodes[trail.rootId];
  const main = app.citedOpen ? renderCited(trail) : (trail.cur.mode==="read" && node.kind==="article") ? renderRead(trail, node) : renderPick(trail, node);
  const nCited = citedNodes(trail).length;
  const terms = Object.values(store.terms);
  const lims = allLimits(trail);
  return topbar(app.ideaReturn
    ? `<button class="btn primary back-btn" data-act="toidea"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to your idea</button>${ideaTab()}`
    : app.citedOpen
      ? `<button class="btn primary back-btn" data-act="citeclose"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to your research</button>${ideaTab()}`
      : `${ideaTab()}<button class="btn cite-btn" data-act="cited">Works cited (${nCited})</button>`) + `
  <div class="work">
    <aside class="col-trail ${app.trailOpen?"open":""}">
      <button class="btn trail-toggle" data-act="toggletrail" aria-expanded="${app.trailOpen}">${app.trailOpen?"Hide your trail":"Show your trail"}</button>
      <div class="tree-wrap">
        <div class="trail-head">Your trail</div>
        <p class="trail-topic">${esc(trail.topic)}</p>
        <ul class="tree">${treeHTML(trail, trail.rootId)}</ul>
        <button class="btn side-cite" data-act="cited">Works cited (${nCited})</button>
        <button class="btn side-cite" data-act="board">Your ideas (${allIdeas().length})</button>
        <details class="gloss"><summary>Terms you've learned (${terms.length})</summary>
          ${terms.length ? `<dl>${terms.slice().reverse().map(t=>`<dt>${esc(t.term)}</dt><dd>${esc(t.meaning)}</dd>`).join("")}</dl>` : `<p class="chat-empty">Open an article to start your glossary.</p>`}
        </details>
        <details class="gloss" ${app.limsOpen?"open":""}><summary>Limitations you've found (${lims.length})</summary>
          ${lims.length ? `<ul class="limlist">${lims.slice().reverse().map(x=>`<li><button class="limrow" data-act="lim" data-id="${x.node.id}" data-i="${x.i}"><span class="limrow-n">${esc(x.L.name)}</span><span class="limrow-s">${esc(x.node.article.headline||x.node.article.title)}${(trail.fixes&&trail.fixes[limKey(x.node.id,x.i)])?" · looked into":""}</span></button></li>`).join("")}</ul>` : `<p class="chat-empty">Every paper you open lists what it can't do yet. They collect here.</p>`}
        </details>
      </div>
    </aside>
    <main class="col-main">${main}</main>
    <aside class="col-chat" aria-label="Scout, your trail guide">${renderChat(trail)}</aside>
  </div>
  <button class="btn primary chat-toggle" data-act="openchat">Ask Scout</button>
  ${renderLimModal(trail)}`;
}

function render(){
  const active = document.activeElement;
  const draft = { topic: ($("input[name=topic]")||{}).value, q: ($("textarea[name=q]")||{}).value, iq: ($("textarea[name=iq]")||{}).value, focus: active && active.name };
  let html;
  if(app.view==="field") html = renderField();
  else if(app.view==="board") html = renderBoardPage();
  else if(app.view==="trail") html = renderTrail();
  else html = renderHome();
  hidePop();
  $("#app").innerHTML = html;
  if(draft.topic && $("input[name=topic]")) $("input[name=topic]").value = draft.topic;
  if(draft.q && $("textarea[name=q]")) $("textarea[name=q]").value = draft.q;
  if(draft.focus==="q" && $("textarea[name=q]")) $("textarea[name=q]").focus();
  if(draft.iq && $("textarea[name=iq]")) $("textarea[name=iq]").value = draft.iq;
  if(draft.focus==="iq" && $("textarea[name=iq]")) $("textarea[name=iq]").focus();
  if(draft.focus==="topic" && $("input[name=topic]")) $("input[name=topic]").focus();
  focusChat(); focusIdeaChat();
  if(app.view==="trail"){
    const t = curTrail();
    if(t){
      const n = t.nodes[t.cur.nodeId];
      if(n && n.kind==="article" && n.detail) ensureVerified(t, n);
      if(n && n.candidates) ensureCandidatesVerified(t, n);
    }
  }
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, trail = curTrail();
  const node = trail && trail.nodes[trail.cur.nodeId];
  switch(act){
    case "home": app.view="home"; app.citedOpen=false; app.ideaId=null; document.body.classList.remove("chat-open"); render(); window.scrollTo({top:0}); break;
    case "field": app.fieldId = el.dataset.id; app.cats = null; app.view="field"; render(); window.scrollTo({top:0}); break;
    case "fieldback": app.fieldId = trail.field; app.cats = null; app.view="field"; render(); break;
    case "cats": loadCats(false); break;
    case "morecats": loadCats(true); break;
    case "cat": { const c = app.cats.items[+el.dataset.i]; if(c) startTrail(app.fieldId, c.name); break; }
    case "resume": app.citedOpen=false; app.trailId = el.dataset.id; app.view="trail"; render(); window.scrollTo({top:0});
      { const t=curTrail(), n=t.nodes[t.cur.nodeId]; if(t.cur.mode==="pick" && !n.candidates) loadCandidates(t,n,false); if(t.cur.mode==="read" && !n.detail) loadDetail(t,n); } break;
    case "deltrail": store.trails = store.trails.filter(t=>t.id!==el.dataset.id); save(); render(); break;
    case "open": openCandidate(trail, node, node.candidates[+el.dataset.i]); break;
    case "refresh": loadCandidates(trail, node, !!node.candidates); break;
    case "lensclear": trail.lens = ""; save(); loadCandidates(trail, node, !!node.candidates); break;
    case "back": goBack(trail, node); break;
    case "deeper": goDeeper(trail, node); break;
    case "reread": trail.cur = {nodeId:node.id, mode:"read"}; save(); render(); break;
    case "retrydetail": loadDetail(trail, node); break;
    case "jump": jumpTo(trail, el.dataset.id); break;
    case "srcopen": document.body.classList.remove("chat-open"); jumpTo(trail, el.dataset.id); { const m = $(".col-main"); if(m){ m.setAttribute("tabindex","-1"); m.focus({preventScroll:true}); } window.scrollTo({top:0, behavior:"smooth"}); } break;
    case "toggletrail": app.trailOpen = !app.trailOpen; render(); break;
    case "suggest": sendChat(el.textContent); break;
    case "pickopt": chooseSource(trail, +el.dataset.mi, +el.dataset.j); break;
    case "optnav": { const m = trail.chat[+el.dataset.mi]; if(m && m.options){ const n=m.options.length; m.view = Math.min(Math.max((m.view||0) + (+el.dataset.d), 0), n-1); save(); render(); } break; }
    case "optgo": { const m = trail.chat[+el.dataset.mi]; if(m && m.options){ m.view = +el.dataset.j; save(); render(); } break; }
    case "moreopts": {
      const m = trail.chat[+el.dataset.mi];
      if(m && m.options && m.chosen===null){
        m.options.forEach(o=>trail.seen.push(o.title));
        m.chosen = -1; m.content = "Set those aside.";
        save(); sendChat(m.question);
      }
      break;
    }
    case "undo": document.body.classList.remove("chat-open"); undoJump(trail, +el.dataset.i); window.scrollTo({top:0}); break;
    case "openchat": document.body.classList.add("chat-open"); focusChat(); { const q=$("textarea[name=q]"); if(q) q.focus(); } break;
    case "closechat": document.body.classList.remove("chat-open"); break;
    case "lim": app.lim = {nodeId: el.dataset.id, i: +el.dataset.i}; app.trailOpen = false; document.body.classList.remove("chat-open"); render(); break;
    case "limclose": app.lim = null; render(); break;
    case "fixes": loadFixes(trail, app.lim.nodeId, app.lim.i); break;
    case "fixopen": openFix(trail, app.lim.nodeId, app.lim.i, +el.dataset.j); break;
    case "board": { if(app.view!=="board") app.backTo = app.view; app.view = "board"; app.citedOpen = false; app.trailOpen = false;
      document.body.classList.remove("chat-open");
      app.ideaId = null; render(); window.scrollTo({top:0}); break; }
    case "boardclose": app.view = (app.backTo && app.backTo!=="board") ? app.backTo : (app.trailId ? "trail" : "home"); app.ideaId = null; render(); window.scrollTo({top:0}); break;
    case "boardlist": app.ideaId = null; render(); window.scrollTo({top:0}); break;
    case "openidea": app.ideaId = el.dataset.id; busy.doc = null; busy.docdl = null; render(); window.scrollTo({top:0}); break;
    case "claimlim": if(app.lim) startIdea(trail, app.lim.nodeId, app.lim.i); break;
    case "ideasuggest": { const idea = curIdea(); if(idea) sendIdeaChat(idea, el.textContent); break; }
    case "ideajump": { const idea = curIdea(); const t = trailOfIdea(idea) || trail; if(!t) break;
      app.ideaReturn = app.ideaId; app.trailId = t.id; app.view = "trail"; jumpTo(t, el.dataset.id); break; }
    case "builddoc": { const idea = curIdea(); if(idea){ busy.docdl = null; buildIdeaDoc(idea); } break; }
    case "dldoc": { const idea = curIdea(); if(idea) downloadIdeaDoc(idea, el.dataset.fmt); break; }
    case "copydoc": { const idea = curIdea(); if(idea) copyIdeaDoc(idea); break; }
    case "ideapaper": { const idea = curIdea(); if(idea) openIdeaPaper(idea, +el.dataset.mi, +el.dataset.j); break; }
    case "explore": { const idea = curIdea(); const m = idea && idea.chat[+el.dataset.i];
      if(idea && m && m.explore){ m.exploreUsed = true; exploreForIdea(idea, m.explore.topic); } break; }
    case "toidea": backToIdea(); break;
    case "cited": app.citedOpen = true; busy.dl = null; app.trailOpen = false; render(); window.scrollTo({top:0}); break;
    case "citeclose": app.citedOpen = false; render(); window.scrollTo({top:0}); break;
    case "citestyle": store.citeStyle = el.dataset.style; save(); busy.dl = null; render(); break;
    case "citetoggle": { const n = trail.nodes[el.dataset.id]; if(n){ n.cited = n.cited === false; save(); render(); } break; }
    case "dl": downloadCited(trail, el.dataset.fmt); break;
    case "copycite": copyCited(trail); break;
    case "backup": saveBackup(); break;
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="restorein" && e.target.files && e.target.files[0]){ restoreBackup(e.target.files[0]); e.target.value=""; }
});
document.addEventListener("submit", e=>{
  const f = e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  if(f.dataset.form==="topic"){ const v = f.topic.value.trim(); if(v) startTrail(app.fieldId, v); }
  if(f.dataset.form==="lens"){ const t = curTrail(); const v = f.lens.value.trim(); if(t && v){ t.lens = v; save(); loadCandidates(t, t.nodes[t.cur.nodeId], !!t.nodes[t.cur.nodeId].candidates); } }
  if(f.dataset.form==="idea"){ const idea = curIdea(); const v = f.iq.value; f.iq.value=""; if(idea) sendIdeaChat(idea, v); }
  if(f.dataset.form==="chat"){ const v = f.q.value; f.q.value=""; sendChat(v); }
});
document.addEventListener("keydown", e=>{
  if(e.target.name==="iq" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); const f=e.target.form; const v=f.iq.value; f.iq.value=""; const idea=curIdea(); if(idea) sendIdeaChat(idea, v); return; }
  if(e.target.name==="q" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); const f=e.target.form; const v=f.q.value; f.q.value=""; sendChat(v); }
});

render();
net.probe();
})();
</script>
</body>
</html>
