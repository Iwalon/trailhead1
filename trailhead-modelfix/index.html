<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhead: follow research anywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,750&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EE; --surface:#F9FBF8; --ink:#1B2A2C; --muted:#5F706D; --line:#D2DBD4;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --mark:#E7AE36; --mark-soft:#F6E3B5; --accent-soft:#DCEEE6; --danger:#A5412F;
  --sans:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101819; --surface:#172224; --ink:#E4EBE7; --muted:#95A6A2; --line:#2A393B;
    --accent:#5CBFA3; --accent-ink:#0C1A17; --mark:#EDBE55; --mark-soft:#3A3120; --accent-soft:#17362F; --danger:#E08A76;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101819; --surface:#172224; --ink:#E4EBE7; --muted:#95A6A2; --line:#2A393B;
  --accent:#5CBFA3; --accent-ink:#0C1A17; --mark:#EDBE55; --mark-soft:#3A3120; --accent-soft:#17362F; --danger:#E08A76;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* Top bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:750;font-size:19px;letter-spacing:-.01em}
.brand svg{width:28px;height:28px;flex:none;overflow:visible}
.notice{background:var(--mark-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 24px 12px;max-width:1392px}
@media (min-width:1440px){.notice{margin-left:auto;margin-right:auto}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--muted);font-weight:600;font-size:14px}
.link:hover{color:var(--ink)}

/* Home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:36px 0 28px}
.hero h1{font-size:clamp(40px,6.4vw,78px);line-height:.98;letter-spacing:-.035em;font-weight:750;margin:0 0 20px}
.hero p{font-family:var(--serif);font-size:19px;line-height:1.6;color:var(--muted);max-width:34em;margin:0}
.hero-art{width:100%;height:auto}
.hero-art .path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.hero-art .path.faint{stroke:var(--line);stroke-width:2}
.hero-art .node{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
.hero-art .node.on{fill:var(--mark);stroke:var(--ink)}
.hero-art .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero-art .draw{animation:none;stroke-dashoffset:0}}
.section-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:28px 0 14px}
.fields{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.fields li{border-bottom:1px solid var(--line)}
.field-row{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;background:none;border:0;text-align:left;padding:18px 6px}
.field-row:hover{background:var(--surface)}
.field-row .glyph{width:48px;height:48px;color:var(--accent)}
.field-row .name{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.field-row .blurb{font-family:var(--serif);color:var(--muted);font-size:16px}
.field-row .go{font-size:14px;font-weight:600;color:var(--muted)}
.field-row:hover .go{color:var(--accent)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:48px}
.recent-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.recent-item strong{font-size:17px;line-height:1.25}
.recent-item span{color:var(--muted);font-size:14px}
.recent-item .row{display:flex;gap:14px;align-items:center;margin-top:4px}
footer{color:var(--muted);font-size:13px;padding:24px 0 40px;font-family:var(--serif)}

/* Field page */
.field-page{max-width:820px;margin:0 auto;padding:18px 24px 60px}
.field-page h1{font-size:clamp(32px,5vw,52px);line-height:1.02;letter-spacing:-.03em;margin:14px 0 22px;font-weight:750}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 300px;min-width:0;font:inherit;font-size:18px;padding:14px 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.or{display:flex;align-items:center;gap:14px;color:var(--muted);margin:34px 0 18px;font-family:var(--serif);font-style:italic}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.cat{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.cat:hover{border-color:var(--accent)}
.cat b{font-size:18px;line-height:1.2;font-weight:600}
.cat span{font-family:var(--serif);color:var(--muted);font-size:15px;line-height:1.45}
.cat i{font-family:var(--serif);font-size:14px;color:var(--ink)}

/* Trail workspace */
.work{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:0;max-width:1440px;margin:0 auto;min-height:calc(100vh - 70px);align-content:start}
.col-trail{border-right:1px solid var(--line);padding:8px 18px 30px}
.col-main{padding:8px 36px 60px;min-width:0}
.col-chat{border-left:1px solid var(--line);display:flex;flex-direction:column;height:calc(100vh - 70px);position:sticky;top:0}
.trail-head{font-size:13px;color:var(--muted);margin:10px 0 2px}
.trail-topic{font-size:20px;font-weight:600;line-height:1.2;margin:0 0 16px;letter-spacing:-.01em}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:9px;padding-left:12px;border-left:2px solid var(--line)}
.tree li{margin:2px 0}
.tnode{display:flex;gap:9px;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:6px 6px;border-radius:8px;font-size:14px;line-height:1.3}
.tnode:hover{background:var(--surface)}
.tnode .dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);margin-top:3px}
.tnode.cur{background:var(--surface);font-weight:600}
.tnode.cur .dot{background:var(--mark)}
.tnode.backed{color:var(--muted)}
.tnode.backed .dot{border-color:var(--muted)}
.tnode .via{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.gloss{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.gloss summary{cursor:pointer;font-weight:600;font-size:15px}
.gloss dl{margin:10px 0 0;font-size:14px;max-height:320px;overflow:auto}
.gloss dt{font-weight:600;margin-top:8px}
.gloss dd{margin:0;font-family:var(--serif);color:var(--muted)}

.crumb{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.pick-title{font-size:clamp(28px,3.6vw,42px);line-height:1.05;letter-spacing:-.03em;margin:0 0 8px;font-weight:750;max-width:20em}
.pick-sub{font-family:var(--serif);color:var(--muted);font-size:17px;margin:0 0 24px;max-width:40em}
.cands{list-style:none;margin:0;padding:0;counter-reset:c}
.cand{width:100%;display:block;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:12px}
.cand:hover{border-color:var(--ink)}
.cand .angle{font-size:13px;color:var(--accent);font-weight:600;display:flex;gap:10px;align-items:center}
.cand .hl{display:block;font-size:clamp(19px,2.2vw,24px);line-height:1.2;letter-spacing:-.015em;font-weight:600;margin-top:4px}
.kind{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;margin-right:8px;background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--mark-soft);color:var(--ink)}
.skel{height:86px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%);background-size:300% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.status{font-family:var(--serif);color:var(--muted);font-style:italic;margin:6px 0 16px}
.err{color:var(--danger);font-weight:600;margin:10px 0}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* Reading view */
.read{max-width:720px}
.read .angle{font-size:14px;color:var(--accent);font-weight:600}
.read h1{font-size:clamp(28px,3.8vw,44px);line-height:1.06;letter-spacing:-.03em;margin:6px 0 14px;font-weight:750}
.meta{font-family:var(--serif);font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.meta cite{font-style:italic;color:var(--ink)}
.read h2{font-size:15px;font-weight:600;color:var(--muted);margin:34px 0 8px}
.prose{font-family:var(--serif);font-size:19px;line-height:1.68}
.prose p{margin:0 0 14px}
.finding{border-left:4px solid var(--mark);padding:6px 0 6px 18px;font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.01em;margin:22px 0 0}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin-top:10px}
.lesson .intro{font-family:var(--serif);font-size:18px;line-height:1.6;margin:0 0 16px}
.terms{margin:0;display:grid;gap:14px}
.terms div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;border-top:1px solid var(--line);padding-top:12px}
.terms dt{font-weight:600;font-size:17px;line-height:1.3}
.terms dd{margin:0;font-family:var(--serif);font-size:17px;line-height:1.55}
.terms dd em{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.links{list-style:none;margin:6px 0 0;padding:0}
.links li{font-family:var(--serif);font-size:17px;line-height:1.5;padding:8px 0;border-top:1px dashed var(--line)}
.links b{font-family:var(--sans);font-weight:600}
.known{font-size:14px;color:var(--muted);margin-top:14px}
.known .chip{margin:2px 4px 0 0;background:transparent;border:1px solid var(--line)}
.fineprint{font-size:13px;color:var(--muted);font-family:var(--serif);margin-top:26px}
.stickyact{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:22px 0 16px;margin-top:10px}

/* Chat */
.chat-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat-head h2{margin:0;font-size:17px}
.chat-log{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:15px;line-height:1.5;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:9px 13px;border-radius:14px 14px 4px 14px}
.msg.a{align-self:flex-start;font-family:var(--serif);font-size:16px}
.msg .jump{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-family:var(--sans);font-size:13px;background:var(--mark-soft);padding:8px 10px;border-radius:10px;white-space:normal}
.chat-empty{color:var(--muted);font-family:var(--serif);font-size:15px}
.suggest{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.suggest button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14px}
.suggest button:hover{border-color:var(--accent)}
.chat-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.chat-form textarea{flex:1;resize:none;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;max-height:140px}
.chat-form textarea:focus{border-color:var(--accent);outline:none}
.chat-toggle{display:none}
.chat-close{display:none}
.trail-toggle{display:none}

@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr) 340px}
  .col-trail{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);padding:0 24px 8px}
  .col-trail .tree-wrap{display:none}
  .col-trail.open .tree-wrap{display:block}
  .trail-toggle{display:inline-flex}
  .col-main{padding:8px 24px 60px}
  .col-chat{height:calc(100vh - 20px)}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:380px}
  .work{grid-template-columns:1fr}
  .col-chat{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);height:100%;border:0}
  body.chat-open .col-chat{display:flex}
  .chat-close{display:inline}
  .chat-toggle{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .field-row{grid-template-columns:40px 1fr}
  .field-row .glyph{width:36px;height:36px}
  .field-row .go{display:none}
  .terms div{grid-template-columns:1fr;gap:4px}
  .lesson{padding:18px}
}

.term{font:inherit;font-weight:600;font-style:inherit;color:var(--accent);background:none;border-bottom:2px solid var(--mark);cursor:pointer;border-radius:2px;padding:0 1px;text-decoration:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.term:hover,.term.active{background:var(--mark-soft)}
.term.known{border-bottom-style:dotted;border-bottom-color:var(--accent)}
.term.demo{cursor:default;pointer-events:none}
.term-hint{font-size:14px;color:var(--muted);margin:-2px 0 12px}
.finding .term,.lesson .term{font-weight:600}
.known .term{font-size:inherit}
#termpop{position:fixed;z-index:50;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:15px;line-height:1.45}
#termpop .pop-term{font-weight:750;font-size:16px;margin-bottom:4px;color:var(--accent)}
#termpop .pop-mean{font-family:var(--serif);font-size:16px}
#termpop .pop-ana{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:6px}
#termpop .pop-note{font-size:12px;color:var(--muted);margin-top:8px}

.cite-note{font-size:14px;color:var(--muted);margin:4px 0 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cite-btn.on{border-color:var(--ink)}
.side-cite{margin-top:18px;width:100%;justify-content:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:4px 0 8px}
.seg button{background:var(--surface);border:0;padding:8px 16px;font-weight:600;font-size:14px}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.cite-heading{font-size:18px;margin:26px 0 6px;font-weight:600}
.cites{list-style:none;margin:0;padding:0;max-width:760px}
.cite{padding:14px 0;border-top:1px solid var(--line)}
.cite-text{font-family:"Times New Roman", var(--serif);font-size:18px;line-height:1.6;padding-left:2.2em;text-indent:-2.2em;overflow-wrap:anywhere}
.cite.off .cite-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.cite-acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;padding-left:2.2em}
.cite-acts a.link{text-decoration:none}
@media (max-width:820px){ .side-cite{display:none} }

.back-btn{font-size:16px;padding:11px 20px 11px 14px}
.chat-sub{font-size:13px;color:var(--muted);margin-top:1px}
.msg.a.working{color:var(--muted);font-style:italic}
.msg.a.nosrc{color:var(--muted)}
.src{display:flex;flex-direction:column;gap:2px;margin-top:10px;font-family:var(--sans);white-space:normal;border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0}
.src.undone{opacity:.6}
.src-k{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.src .link{color:var(--accent)}
.src .link:hover{color:var(--ink)}
.src-t{font-weight:600;font-size:14px;line-height:1.3}
.src-why{font-size:13px;color:var(--muted);line-height:1.35}
.src-acts{display:flex;gap:14px;margin-top:4px}

.cand{position:relative}
.cand-year{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.read-year{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.src-also{margin-top:4px;font-size:13px;color:var(--muted)}
.src-also summary{cursor:pointer;font-weight:600}
.src-also div{margin-top:4px;line-height:1.35}

.lens{margin:0 0 20px}
.lens-form label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.lens-row{display:flex;gap:8px;flex-wrap:wrap}
.lens-row input{flex:1 1 240px;min-width:0;font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.lens-row input:focus{border-color:var(--accent);outline:none}
.lens-on{display:inline-block;background:var(--accent-soft);border-radius:999px;padding:6px 14px;font-size:15px;margin-right:12px}

.lims{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;max-width:640px}
.lim{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--danger);border-radius:12px;padding:12px 16px}
.lim:hover{border-color:var(--ink);border-left-color:var(--danger)}
.lim-name{font-weight:600;font-size:17px;line-height:1.3}
.lim-go{flex:none;font-size:13px;font-weight:600;color:var(--accent)}
.limlist{list-style:none;margin:8px 0 0;padding:0}
.limrow{width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--danger);padding:6px 8px;border-radius:0 8px 8px 0;display:block}
.limrow:hover{background:var(--surface)}
.limrow-n{display:block;font-size:14px;font-weight:600;line-height:1.3}
.limrow-s{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.modal-back{position:fixed;inset:0;background:rgba(10,20,20,.45);z-index:60}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:min(80vh,720px);overflow:auto;background:var(--bg);border:1.5px solid var(--ink);border-radius:18px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal-x{position:absolute;top:10px;right:14px;background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
.modal-x:hover{color:var(--ink)}
.modal-k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--danger)}
.modal-h{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:4px 0 10px;font-weight:750}

<script>
(function(){
"use strict";

/* ---------- Fields ---------- */
const FIELDS = [
  {id:"cs", name:"Computer science", blurb:"How computers think, learn, and talk to each other",
   glyph:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14 7 24l10 10M31 14l10 10-10 10M27 10l-6 28"/></svg>'},
  {id:"bio", name:"Biology", blurb:"How living things work, from single cells to whole ecosystems",
   glyph:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><ellipse cx="24" cy="24" rx="17" ry="13"/><circle cx="21" cy="22" r="5"/><circle cx="33" cy="29" r="1.8" fill="currentColor"/><circle cx="12" cy="27" r="1.4" fill="currentColor"/></svg>'},
  {id:"eng", name:"Engineering", blurb:"How people design and build machines, structures, and systems",
   glyph:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M6 36h36M10 36 24 12l14 24M17 24h14"/><circle cx="24" cy="12" r="2.5" fill="currentColor"/></svg>'},
  {id:"phys", name:"Physics", blurb:"The rules behind matter, energy, space, and time",
   glyph:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><ellipse cx="24" cy="24" rx="19" ry="7.5"/><ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(120 24 24)"/><circle cx="24" cy="24" r="2.8" fill="currentColor"/></svg>'},
  {id:"chem", name:"Chemistry", blurb:"What stuff is made of and how it changes into other stuff",
   glyph:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M24 7l14 8v16l-14 8-14-8V15z"/><path d="M24 13l9 5M15 20v10"/></svg>'}
];
const fieldById = id => FIELDS.find(f=>f.id===id);

/* ---------- Storage ---------- */
const KEY = "trailhead-v1";
function blank(){ return {trails:[], tags:{}, terms:{}, ideas:[]}; }
let store = blank();
try { const raw = localStorage.getItem(KEY); if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.trails)) store = Object.assign(blank(), p); } } catch(e){}
if(!Array.isArray(store.ideas)) store.ideas = [];
// ideas used to live on a trail; lift any of those out so they survive new trails
let migrated = false;
store.trails.forEach(t => {
  if(Array.isArray(t.ideas) && t.ideas.length){
    t.ideas.forEach(x => { if(!store.ideas.some(y=>y.id===x.id)){ store.ideas.push(Object.assign({trailId:t.id, trailTopic:t.topic, field:t.field}, x)); migrated = true; } });
  }
  if(t.ideas){ delete t.ideas; migrated = true; }
});
if(migrated) save();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

/* ---------- AI access ---------- */
const API = "/api";   // our backend, when this is running as a real site

/* The backend speaks the same shape as the artifact's sample(): (input, opts) -> {text, truncated} */
function backendSample(){
  return async function(input, opts){
    opts = opts || {};
    const r = await fetch(API + "/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ input, modelTier: opts.modelTier || "default" }),
      signal: opts.signal
    }).catch(err => { throw {code: (err && err.name==="AbortError") ? "cancelled" : "upstream_error", message:String(err)}; });
    let data = null;
    try { data = await r.json(); } catch(e){}
    if(!r.ok){
      const code = (data && data.code) || (r.status===429 ? "rate_limited" : r.status===413 ? "prompt_too_large" : "upstream_error");
      throw {code, message:(data && data.message) || ("HTTP " + r.status)};
    }
    const text = String((data && data.text) || "");
    if(!text.trim()) throw {code:"empty_completion", message:"no text"};
    if(typeof opts.onText === "function") opts.onText({text, delta:text});
    return {text, truncated: !!(data && data.truncated), modelTierApplied: opts.modelTier || "default"};
  };
}
const samplePromise = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("sample").catch(()=>null).then(s => s || probeBackend())
  : probeBackend();
async function probeBackend(){
  try{
    const r = await fetch(API + "/health", {method:"GET"});
    if(!r.ok) return null;
    const j = await r.json().catch(()=>null);
    return (j && j.ok) ? backendSample() : null;
  }catch(e){ return null; }
}
let aiState = "pending"; // pending | ok | off | denied
samplePromise.then(s => { aiState = s ? "ok" : "off"; render(); });
async function ai(){ const s = await samplePromise; if(!s) throw {code:"not_available_here"}; return s; }
function errCopy(e){
  const c = e && e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"){ aiState="denied"; return "AI features are turned off for this page. Allow Claude access to use them."; }
  if(c==="not_available_here") return "AI features only work when this page is opened inside Claude.";
  if(c==="rate_limited") return "Too many requests right now. Wait a moment, then try again.";
  if(c==="session_expired") return "Your Claude session expired. Sign in again, then try again.";
  if(c==="invalid_json") return "The answer came back in an unexpected shape. Try again.";
  if(c==="truncated") return "The answer was cut off before it finished. Try again.";
  if(c==="no_items") return "No usable articles came back for this topic. Try again, or phrase the topic a little differently.";
  if(c==="prompt_too_large") return "That was too much for one message. Try sending it in smaller pieces.";
  if(c==="refused") return "Claude declined that one. Try saying it a different way, or in shorter pieces.";
  if(c==="cancelled") return "";
  // the backend passes the upstream reason through; showing it beats guessing
  const detail = e && e.message ? String(e.message).slice(0, 180) : "";
  return detail ? "The AI service refused that request: " + detail : "Something interrupted the request. Try again.";
}

/* ---------- Helpers ---------- */
/* Tolerant JSON: accepts fences, wrapper objects, stray prose, trailing commas */
function looseParse(text){
  let t = String(text||"").trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t = fence[1].trim();
  const tries = [t];
  const fo = t.indexOf("{"), fa = t.indexOf("[");
  const start = (fa!==-1 && (fo===-1 || fa<fo)) ? fa : fo;
  if(start>-1){ const end = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")); if(end>start) tries.push(t.slice(start,end+1)); }
  for(const c of tries){
    for(const v of [c, c.replace(/,\s*([}\]])/g,"$1")]){ try { return JSON.parse(v); } catch(e){} }
  }
  // Truncated mid-object: cut back to the last complete value and close what's open
  const fixed = repairTruncated(t);
  if(fixed !== null){ try { return JSON.parse(fixed); } catch(e){} }
  // JSON lines fallback
  const rows = t.split("\n").map(l=>l.trim().replace(/,$/,"")).filter(l=>l.startsWith("{")&&l.endsWith("}"))
    .map(l=>{ try{return JSON.parse(l);}catch(e){return null;} }).filter(Boolean);
  if(rows.length) return rows;
  return undefined;
}
function repairTruncated(t){
  let inStr = false, esc = false, depth = 0, lastGood = -1;
  const stack = [];
  for(let i=0;i<t.length;i++){
    const c = t[i];
    if(inStr){
      if(esc) esc = false;
      else if(c === "\\") esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === "{" || c === "["){ stack.push(c === "{" ? "}" : "]"); depth++; continue; }
    if(c === "}" || c === "]"){ stack.pop(); depth--; if(depth === 0) return null; continue; }
    // a comma at depth 1+ means everything before it is a complete value
    if(c === "," && depth > 0) lastGood = i;
  }
  if(!stack.length || lastGood < 0) return null;
  // reopen the stack as it stood at lastGood
  let head = t.slice(0, lastGood);
  const st2 = []; inStr = false; esc = false;
  for(let i=0;i<head.length;i++){
    const c = head[i];
    if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"'){ inStr=true; continue; }
    if(c==="{"||c==="[") st2.push(c==="{"?"}":"]");
    else if(c==="}"||c==="]") st2.pop();
  }
  if(inStr || !st2.length) return null;
  return head + st2.reverse().join("");
}
function findArray(v){
  if(Array.isArray(v)) return v;
  if(v && typeof v==="object"){ for(const k of Object.keys(v)){ if(Array.isArray(v[k]) && v[k].length && typeof v[k][0]==="object") return v[k]; } }
  return null;
}
async function askJSON(prompt, opts){
  const s = await ai();
  const r = await s(prompt, opts);
  const v = looseParse(r.text);
  if(v===undefined){ console.warn("Trailhead: unparseable reply", r.truncated ? "(truncated)" : "", r.text); throw {code: r.truncated ? "truncated" : "invalid_json"}; }
  return v;
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const busy = {}; // transient loading/error state
function scholar(a){ return "https://scholar.google.com/scholar?q=" + encodeURIComponent('"' + a.title + '" ' + (a.authors||"")); }
/* Best available link to the real paper, and what to call it */
function sourceLink(node){
  const a = node.article || {}, c = (node.detail && node.detail.citation) || {};
  const v = node.verified;
  if(v && v.found && v.oaUrl) return {url:v.oaUrl, direct:true, note:"Free full text, found in the open-access record for this paper."};
  if(v && v.found && v.doi) return {url:"https://doi.org/" + v.doi, direct:true, note:"Opens the publisher's page for this paper (verified DOI)."};
  const doi = String(c.doi||"").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,"").replace(/^doi:\s*/i,"");
  if(doi) return {url:"https://doi.org/" + doi, direct:true, note:"Opens the publisher's page for this paper (DOI)."};
  const u = String(c.url||"").trim();
  if(/^https?:\/\//i.test(u)) return {url:u, direct:true, note:"Opens the page the paper is published on."};
  return {url:scholar(a), direct:false, note:"No direct link was available, so this searches Google Scholar for the exact title."};
}


/* ---------- Live lookups against open scholarly databases ---------- */
/* OpenAlex and Crossref are free, keyless and CORS-enabled. If this page's
   network is blocked the probe fails once and everything degrades quietly. */
const net = (function(){
  let state = "unknown";           // unknown | on | off
  let fails = 0;
  const cache = {};
  const MAIL = (window.TRAILHEAD_CONTACT || "trailhead-app@example.org");  // set in config.js

  async function get(url, ms){
    if(state==="off") return null;
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), ms||9000);
    try{
      const r = await fetch(url, {signal:ctl.signal, headers:{"Accept":"application/json"}});
      if(!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      if(state!=="on"){ state = "on"; render(); }
      fails = 0;
      return j;
    }catch(e){
      if(++fails >= 2 && state!=="on"){ state = "off"; render(); }
      return null;
    }finally{ clearTimeout(t); }
  }

  const norm = t => String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  function close(a, b){
    a = norm(a); b = norm(b);
    if(!a || !b) return false;
    if(a===b) return true;
    if(a.length>18 && b.length>18 && (a.startsWith(b) || b.startsWith(a))) return true;
    const A = new Set(a.split(" ").filter(w=>w.length>3)), B = b.split(" ").filter(w=>w.length>3);
    if(!A.size || !B.length) return false;
    const hit = B.filter(w=>A.has(w)).length;
    return hit / Math.max(A.size, B.length) >= 0.8;
  }
  function unInvert(idx){
    if(!idx || typeof idx !== "object") return "";
    const out = [];
    for(const w of Object.keys(idx)) for(const pos of idx[w]) out[pos] = w;
    return out.join(" ").replace(/\s+/g," ").trim();
  }
  function peerStatus(w){
    const src = (w.primary_location && w.primary_location.source) || null;
    const st = src && String(src.type||"").toLowerCase();
    const ty = String(w.type||"").toLowerCase();
    if(w.is_retracted) return {peer:"retracted", label:"Retracted"};
    if(ty==="preprint") return {peer:"no", label:"Preprint, not peer reviewed"};
    if(st==="repository") return {peer:"no", label:(ty==="article"||!ty) ? "Preprint, not peer reviewed" : "Not peer reviewed"};
    if(st==="journal" || st==="conference" || ty==="article" || ty==="review" || ty==="proceedings-article")
      return {peer:"yes", label:"Peer reviewed"};
    if(st==="book series" || ty==="book" || ty==="book-chapter") return {peer:"yes", label:"Peer reviewed (book)"};
    return {peer:"unclear", label:"Review status unclear"};
  }
  function shape(w){
    const src = (w.primary_location && w.primary_location.source) || {};
    const oa = w.open_access || {};
    const ps = peerStatus(w);
    return {
      found: true,
      id: w.id || "",
      doi: String(w.doi||"").replace(/^https?:\/\/(dx\.)?doi\.org\//i,""),
      title: w.display_name || w.title || "",
      year: w.publication_year || "",
      venue: src.display_name || "",
      venueType: String(src.type||w.type||"").toLowerCase(),
      publisher: src.host_organization_name || "",
      authors: (w.authorships||[]).map(x => (x.author && x.author.display_name) || "").filter(Boolean),
      abstract: unInvert(w.abstract_inverted_index),
      citedBy: w.cited_by_count || 0,
      retracted: !!w.is_retracted,
      peer: ps.peer, peerLabel: ps.label,
      oaUrl: oa.oa_url || (w.best_oa_location && w.best_oa_location.pdf_url) || "",
      isOA: !!oa.is_oa,
      volume: (w.biblio && w.biblio.volume) || "",
      issue: (w.biblio && w.biblio.issue) || "",
      pages: (w.biblio && w.biblio.first_page) ? ((w.biblio.first_page) + (w.biblio.last_page ? "-" + w.biblio.last_page : "")) : ""
    };
  }

  async function lookup(article){
    const key = norm(article.title);
    if(!key) return null;
    if(cache[key] !== undefined) return cache[key];
    const sel = "id,doi,display_name,publication_year,type,primary_location,open_access,best_oa_location,cited_by_count,authorships,biblio,abstract_inverted_index,is_retracted";
    const base = "https://api.openalex.org/works?per-page=5&search=" + encodeURIComponent(article.title) + "&mailto=" + encodeURIComponent(MAIL);
    let j = await get(base + "&select=" + sel);
    if(!j && state !== "off") j = await get(base);   // a rejected field list shouldn't look like an outage
    if(!j){ return null; }                      // offline or the request failed
    const hits = (j.results||[]);
    const m = hits.find(w => close(w.display_name || w.title, article.title));
    const out = m ? shape(m) : {found:false};
    cache[key] = out;
    return out;
  }
  async function probe(){
    if(state!=="unknown") return state;
    await get("https://api.openalex.org/works?per-page=1&select=id&filter=doi:10.1038/nature14539&mailto=" + encodeURIComponent(MAIL), 8000);
    if(state === "unknown"){ state = "off"; render(); }   // get() flips it to "on" when the request lands
    return state;
  }
  /* Full text, when the backend can get it. Resolves null when it can't. */
  async function fullText(v){
    if(!v || !v.found) return null;
    const key = "ft:" + (v.doi || v.title);
    if(cache[key] !== undefined) return cache[key];
    try{
      const r = await fetch("/api/fulltext?" + new URLSearchParams({ doi: v.doi || "", title: v.title || "" }));
      if(!r.ok){ cache[key] = null; return null; }
      const j = await r.json();
      const out = (j && j.text) ? {text:String(j.text).slice(0, 20000), source:String(j.source||"")} : null;
      cache[key] = out;
      return out;
    }catch(e){ cache[key] = null; return null; }
  }
  return { lookup, probe, fullText, get state(){ return state; } };
})();

/* Merge a verified record into an article and its citation */
function applyVerified(node, v){
  if(!v) return;
  node.verified = v;
  if(!v.found) return;
  const a = node.article;
  if(v.title) a.title = v.title;
  if(v.year) a.year = v.year;
  if(v.venue) a.venue = v.venue;
  a.peer = v.peer; a.peerLabel = v.peerLabel; a.citedBy = v.citedBy; a.retracted = v.retracted;
  a.preprint = v.peer === "no";
  if(node.detail){
    const c = node.detail.citation = node.detail.citation || {};
    if(v.doi) c.doi = v.doi;
    if(v.venue) c.container = v.venue;
    if(v.year) c.year = String(v.year);
    if(v.title) c.title = v.title;
    if(v.publisher) c.publisher = v.publisher;
    if(v.volume) c.volume = v.volume;
    if(v.issue) c.issue = v.issue;
    if(v.pages) c.pages = v.pages;
    if(v.authors && v.authors.length) c.authors = v.authors.map(n=>{
      const parts = String(n).trim().split(/\s+/);
      return {family: parts.pop() || n, given: parts.join(" ")};
    });
    c.type = v.peer === "no" ? "preprint" : (v.venueType === "conference" ? "conference" : c.type || "journal");
  }
}
/* Check a paper that predates verification, or whose check never ran */
const verifying = {};
async function ensureVerified(trail, node){
  if(!node || node.kind!=="article" || node.verified !== undefined || verifying[node.id]) return;
  if(net.state === "off") return;
  verifying[node.id] = true;
  const v = await net.lookup(node.article);
  if(v){ applyVerified(node, v); save(); render(); }
  delete verifying[node.id];
}
async function ensureCandidatesVerified(trail, node){
  const list = (node && node.candidates) || [];
  const todo = list.filter(c => !c.checked);
  if(!todo.length || net.state === "off" || verifying["c:"+node.id]) return;
  verifying["c:"+node.id] = true;
  await Promise.all(todo.map(async c => {
    const v = await net.lookup(c);
    if(!v) return;
    c.checked = true;
    if(v.found){
      c.title = v.title || c.title; c.year = v.year || c.year; c.venue = v.venue || c.venue;
      c.peer = v.peer; c.peerLabel = v.peerLabel; c.citedBy = v.citedBy; c.retracted = v.retracted;
      c.preprint = v.peer === "no"; c.verified = true;
    } else c.verified = false;
  }));
  delete verifying["c:"+node.id];
  save(); render();
}

/* What a paper's peer-review state is, verified first, AI's guess second */
const VENUE_PEER = {journal:"yes", conference:"yes", book:"yes", chapter:"yes", proceedings:"yes", workshop:"yes", preprint:"no", thesis:"unclear", report:"unclear", dataset:"no"};
function peerOf(node){
  const a = node.article || {};
  if(a.retracted) return {k:"retracted", label:"Retracted"};
  if(a.peer) return {k:a.peer, label:a.peerLabel || ""};                       // confirmed by lookup
  const d = node.detail || {};
  const guess = a.peerGuess
    || (typeof d.peerReviewed === "boolean" ? (d.peerReviewed ? "yes" : "no") : null)
    || VENUE_PEER[String(a.venueType||"").toLowerCase()]
    || VENUE_PEER[String((d.citation && d.citation.type)||"").toLowerCase()]
    || (a.preprint ? "no" : null);
  if(guess==="yes") return {k:"yes", label:"Peer reviewed"};
  if(guess==="no") return {k:"no", label: (a.preprint || String(a.venueType||"")==="preprint" || String((d.citation&&d.citation.type)||"")==="preprint") ? "Preprint, not peer reviewed" : "Not peer reviewed"};
  return {k:"unclear", label:"Review status unclear"};
}

/* ---------- App state ---------- */
const app = { view:"home", fieldId:null, cats:null, trailId:null, trailOpen:false, lim:null, ideaId:null, ideaReturn:null, backTo:"home" };
const curTrail = () => store.trails.find(t=>t.id===app.trailId);

function bumpTags(trail, tags, amt){
  if(!trail) return;
  if(!trail.tags) trail.tags = {};
  (tags||[]).forEach(t=>{ const k = String(t).toLowerCase().trim(); if(!k) return;
    trail.tags[k] = Math.max(-6, Math.min(12, (trail.tags[k]||0) + amt)); });
}
function interestText(trail){
  const e = Object.entries((trail && trail.tags) || {});
  const likes = e.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  const meh = e.filter(x=>x[1]<0).sort((a,b)=>a[1]-b[1]).slice(0,5).map(x=>x[0]);
  return "Leans toward: " + (likes.join(", ")||"no signal yet") + ". Less drawn to: " + (meh.join(", ")||"no signal yet") + ".";
}
function pathTo(trail, id){ const out=[]; let n = trail.nodes[id]; while(n){ out.unshift(n); n = trail.nodes[n.parentId]; } return out; }

/* ---------- Trail creation ---------- */
function startTrail(fieldId, topic){
  topic = topic.trim(); if(!topic) return;
  const root = {id:uid(), parentId:null, kind:"root", created:Date.now(), candidates:null};
  const t = {id:uid(), field:fieldId, topic, created:Date.now(), updated:Date.now(), rootId:root.id,
    nodes:{[root.id]:root}, cur:{nodeId:root.id, mode:"pick"}, seen:[], chat:[], tags:{}, lens:""};
  store.trails.unshift(t); store.trails = store.trails.slice(0,12); save();
  app.trailId = t.id; app.view = "trail"; render();
  loadCandidates(t, root, false);
}

      + (fresh ? `\nAvoid these, already shown: ${(app.cats.items||[]).map(c=>c.name).join("; ")}.` : "");

/* ---------- AI: five candidate articles ---------- */
async function loadCandidates(trail, node, fresh){
  const key = node.id+":c";
  if(busy[key] && busy[key].loading) return;

  const seen = trail.seen.concat(Object.values(trail.nodes).filter(n=>n.article).map(n=>n.article.title)).slice(-70);
  const prompt = `You are a careful research librarian helping someone explore the academic literature.
Field: ${f.name}. Starting topic: "${trail.topic}".
${path.length ? "Articles the reader went deeper on, in order: " + path.map(n=>`"${n.article.title}" (${n.article.year})`).join(" -> ") + "." : "The reader is just starting."}
${forIdea ? `THE READER IS TESTING AN IDEA OF THEIR OWN: "${forIdea.title}"${forIdea.gap ? " — " + forIdea.gap : ""}. They came here to read up on: "${node.topic}". Every one of the five must bear on that: work that already tried it, work that gives them a method, work that measures the thing they want to measure, or work that would tell them it won't work. Say in each headline what it brings to that question.` : ""}

Reader interest profile from their choices on THIS trail only: ${interestText(trail)} Use it lightly, to steer WHICH sub-topic fills a slot (about 2 of the 5), never to drop a slot or repeat the same narrow sub-topic.

Give exactly 5 real, published papers that you are highly confident exist with the exact title, authors, year, and venue. Never invent a paper. If unsure a paper exists, choose a different one you are sure of.
The 5 papers MUST fill these 5 different slots, one paper each, so the set is a true mix and not all overviews or all about impact and adoption:
1. "Big picture": ${node.kind==="root" ? "a review or survey that maps the topic" : forIdea ? "a review or survey covering the area their idea sits in" : "a review, survey, or perspective on the sub-area this branch has reached"}.
2. "How it works": a technical paper on the core mechanism or underlying science: the physics, chemistry, biology, math, or algorithm that makes the thing function.
3. "How it's built": a technical design or engineering paper: a specific system, device, architecture, method, or fabrication/implementation, with real design choices and trade-offs.
4. "Testing it": an experimental, measurement, benchmark, or modeling study that evaluates performance, limits, or failure modes with data.
5. "Wild card": from a different corner than the other four: a foundational classic that started the area, a rival approach, an unexpected cross-field application, or the human, social, or ethical side.
At most ONE of the five may be mainly about effects, user experience, adoption, or society. Slots 2, 3, and 4 must be primary research that gets into technical details, not reviews.
Also spread across sub-areas and eras (include at least one older foundational paper and at least one from the last five years).
Source quality: only established peer-reviewed journals, reputable society or university publishers, major conferences, or well-known preprint servers (arXiv, bioRxiv, ChemRxiv). Exclude anything from publishers or standalone journals on Beall's list of potentially predatory publishers (for example OMICS International, SCIRP, and similar).
Do not repeat any of these titles: ${seen.length ? seen.map(t=>`"${t}"`).join("; ") : "(none)"}.

Reply with only a raw JSON array (starting with [ and ending with ]), no wrapper object, no code fence, no commentary. Each of the 5 objects:
{"title": string, "authors": string (e.g. "Watson, J. D. & Crick, F. H. C." or "Smith, A. et al."), "year": number, "venue": string, "preprint": boolean, "headline": string (plain-language hook, max 14 words, accurate, no jargon, makes a curious person want to click), "kind": one of "Big picture" | "How it works" | "How it's built" | "Testing it" | "Wild card", "venueType": one of "journal" | "conference" | "preprint" | "book" | "thesis" | "report" (what kind of venue it appeared in), "angle": string (2-4 words on what corner of the field it represents), "tags": [3 short lowercase interest tags]}
Return them in slot order 1-5.`;
  try{
    const res = await askJSON(prompt, {cache:false});
    const list = (findArray(res)||[]).filter(x=>x && (x.title||x.headline)).map(x=>({
      title: String(x.title||x.headline), authors: String(x.authors||x.author||""), year: x.year||"", venue: String(x.venue||x.journal||""),
      preprint: !!x.preprint, headline: String(x.headline||x.title), angle: String(x.angle||""), kind: String(x.kind||""), tags: Array.isArray(x.tags)?x.tags:[],
      venueType: String(x.venueType||"").toLowerCase(),
      peerGuess: (String(x.venueType||"").toLowerCase()==="preprint" || x.preprint) ? "no" : ["journal","conference","book"].includes(String(x.venueType||"").toLowerCase()) ? "yes" : "unclear"
    })).slice(0,5);
    if(!list.length){ console.warn("Trailhead: no articles in reply", res); throw {code:"no_items"}; }
    node.candidates = list; trail.updated = Date.now(); save();
    busy[key] = null;
    render();
    // Check each one against OpenAlex; quiet no-op when this page can't reach the network
    await Promise.all(list.map(async c => {
      const v = await net.lookup(c);
      if(!v) return;
      c.checked = true;

        c.title = v.title || c.title; c.year = v.year || c.year; c.venue = v.venue || c.venue;
        c.peer = v.peer; c.peerLabel = v.peerLabel; c.citedBy = v.citedBy; c.retracted = v.retracted;
        c.preprint = v.peer === "no"; c.verified = true;
      } else { c.verified = false; }
    }));
    save();
  }catch(e){ busy[key] = {error: errCopy(e)}; }
  render();
}

/* ---------- AI: summary + crash course ---------- */
const detailInflight = {};
function loadDetail(trail, node){
  if(!detailInflight[node.id]) detailInflight[node.id] = loadDetailRun(trail, node).finally(()=>{ delete detailInflight[node.id]; });
  return detailInflight[node.id];
}
async function loadDetailRun(trail, node){
  const key = node.id+":d";
  if(busy[key] && busy[key].loading) return;
  busy[key] = {loading:true}; render();
  const a = node.article, f = fieldById(trail.field);
  const known = Object.values(store.terms).map(t=>t.term).slice(-90);
  const v = await net.lookup(a);
  if(v){ applyVerified(node, v); if(v.found) busy[key] = {loading:true}; render(); }
  const real = v && v.found ? v : null;
  const ft = real ? await net.fullText(real) : null;
  const prompt = `You are explaining a research paper to a smart newcomer to ${f.name}.
Paper: "${a.title}" by ${a.authors} (${a.year}), ${a.venue}.
${real ? `VERIFIED RECORD, looked up live just now — trust these over your own memory:
- Exact title: ${real.title}
- Authors: ${real.authors.slice(0,12).join(", ")}${real.authors.length>12?", et al.":""}
- Year: ${real.year}. Venue: ${real.venue} (${real.peerLabel}). ${real.doi?"DOI: "+real.doi:""}
- Cited by ${real.citedBy} other works.${real.retracted?" THIS PAPER HAS BEEN RETRACTED — say so plainly in the first sentence of the summary and explain what that means.":""}
${real.abstract ? "- The paper's REAL abstract:\n" + real.abstract.slice(0,3000) : "- No abstract was available from the database."}
Use the real abstract as your anchor for what this paper is and claims. Go beyond it with what you know of the full paper's methods and results, but never contradict it.` : ""}
${ft ? `\nTHE PAPER'S ACTUAL FULL TEXT (fetched live from ${ft.source} \u2014 this is the paper itself, so it outranks everything else, including your own memory. Take the results, numbers and limitations straight from it):\n${ft.text.slice(0, 10000)}\n` : ""}
${node.question ? `The reader arrived here by asking: "${node.question}"` : ""}

1. Pitch the WHOLE paper, not its abstract. Abstracts are often teasers; the reader should get the real payoff here. Imagine a science journalist's 60-second pitch that pulls out only the most important and most interesting parts of the full paper:
   - the question and why it matters,
   - the clever part of how they did it (for technical papers: the actual mechanism, design, or method in simple concrete steps, like what each part does or how the test was set up),
   - what they actually found, in detail. This is the most important part: report the RESULTS the paper reports in its results section, figures and tables, not the vague promise in its abstract. Abstracts say "we demonstrate improved performance"; the results say how much, measured how, compared to what, and under what conditions. Give the concrete numbers, units, test conditions, and comparisons you reliably know for this specific paper. If you are not sure of a number, say what was measured and in which direction it moved rather than inventing a figure, but never fall back on an abstract-style claim when you know the real result.
   Spend at least a third of the summary on these results.
   For a review or survey, give its real conclusions: the main approaches it compares, which work best and why, what is still unsolved. Never write things like "this paper explores" or "this review discusses" without saying what it concluded. Don't tease; deliver.
   Voice: write for a curious reader who is new to this field but is not a child. Clear, direct, and specific, the way a good science magazine writes for adults. No baby talk, no exclamation marks, no "imagine you're a tiny ball" analogies, no talking down.
   THIS IS A SUMMARY, NOT A CONVERSATION. Write ABOUT the paper, never TO the reader. Banned from the summary entirely: "I", "me", "my", "you", "your", "Note:", "note that", "it's worth saying", "as far as I can tell", "I believe", "the title given", anything about which paper you think this is, and any remark about your own confidence, memory or sources. "We" is allowed only for the paper's own authors. The reader wants the paper explained, not your process.
   If something is uncertain, that uncertainty belongs in the "note" field below, never in the summary. If you are unsure of a number, write the result in general terms inside the summary and say nothing about being unsure.
   Do NOT avoid the field's real technical terms: use them, because every term you use gets defined below and highlighted so the reader can hover it for the meaning. Give enough context around each term that the sentence still makes sense, then let the definition do the rest. Explain ideas plainly, but keep the precision of the paper.
   Use 180-260 words in 3 paragraphs, with the final paragraph devoted to the results and what they mean. Base it only on what you reliably know about this paper; if you are unsure of a number or detail, describe the result in general terms rather than invent it.
2. Write a one-sentence key finding: the single most important concrete result, in the same voice. Same rule — about the paper, no commentary about yourself.

4. REQUIRED: list 2-4 real limitations of this paper's work: what it cannot do, where it breaks down, what the authors admit is unsolved, or what a later paper would need to fix. Prefer limitations the authors themselves name. Each gets a short name (max 7 words, specific to this work, not generic like "more research needed") and 1-2 sentences saying what the limitation is and why it matters for anyone building on this.

  try{

    if(d.venueKind && !node.article.venueType) node.article.venueType = String(d.venueKind).toLowerCase();

/* ---------- Navigation actions ---------- */
function openCandidate(trail, parent, cand){
  app.citedOpen = false;
  let child = Object.values(trail.nodes).find(n=>n.parentId===parent.id && n.article && n.article.title===cand.title);
  if(!child){
    child = {id:uid(), parentId:parent.id, kind:"article", origin:"pick", created:Date.now(), article:cand,
      detail:null, candidates:null, returnTo:{nodeId:parent.id, mode:"pick"}};
    trail.nodes[child.id] = child;
  }
  bumpTags(trail, cand.tags, 1);
  if(cand.kind) bumpTags(trail, ["paper type: " + cand.kind.toLowerCase()], 1);
  trail.cur = {nodeId:child.id, mode:"read"}; save(); render(); scrollTop();
  if(!child.detail) loadDetail(trail, child);
}
function goBack(trail, node){
  app.citedOpen = false;
  if(!node || node.kind!=="article"){ jumpTo(trail, (node&&node.parentId)||trail.rootId); return; }
  if(node.verdict!=="continued" && node.verdict!=="backed"){ node.verdict="backed"; bumpTags(trail, node.article.tags, -1.5); }
  trail.cur = Object.assign({}, node.returnTo || {nodeId:node.parentId, mode:"pick"});
  if(!trail.nodes[trail.cur.nodeId]) trail.cur = {nodeId:trail.rootId, mode:"pick"};
  save(); render(); scrollTop();
}
function goDeeper(trail, node){
  app.citedOpen = false;
  if(!node || node.kind!=="article") return;
  if(node.verdict==="backed") bumpTags(trail, node.article.tags, 1.5);
  if(node.verdict!=="continued"){ node.verdict="continued"; bumpTags(trail, node.article.tags, 2); }
  trail.cur = {nodeId:node.id, mode:"pick"}; save(); render(); scrollTop();
  if(!node.candidates) loadCandidates(trail, node, false);
}
function jumpTo(trail, nodeId){
  app.citedOpen = false;
  const n = trail.nodes[nodeId]; if(!n) return;
  trail.cur = {nodeId, mode: (n.kind==="root"||n.kind==="explore") ? "pick" : "read"};
  save(); app.trailOpen=false; render(); scrollTop();
  if((n.kind==="root"||n.kind==="explore") && !n.candidates) loadCandidates(trail, n, false);
  if(n.kind==="article" && !n.detail) loadDetail(trail, n);
}
function scrollTop(){ const m = $(".col-main"); if(m) window.scrollTo({top:0}); }

function articleLine(n){

}
function recentChat(trail, dropLast){
  const list = dropLast ? trail.chat.slice(0,-dropLast) : trail.chat;

}

/* The reader picked one of Scout's options: open it, then answer from it */
async function chooseSource(trail, mi, j){
  const m = trail.chat[mi];
  if(!m || !m.options || m.chosen !== null || (busy.chat && busy.chat.loading)) return;
  const pick = m.options[j]; if(!pick) return;
  m.chosen = j;
  // the ones they passed over shouldn't come back around
  m.options.forEach((o,k)=>{ if(k!==j) trail.seen.push(o.title); });

  const here = trail.nodes[trail.cur.nodeId] || trail.nodes[trail.rootId];
  const dup = Object.values(trail.nodes).find(n=>n.kind==="article" && n.article.title.toLowerCase()===pick.title.toLowerCase());
  const prev = Object.assign({}, trail.cur);
  let target = dup;
  if(!target){
    target = {id:uid(), parentId:here.id, kind:"article", origin:"chat", question:m.question, created:Date.now(),
      article:{title:pick.title, authors:pick.authors, year:pick.year, venue:pick.venue, preprint:pick.preprint,
        headline:pick.headline, kind:pick.kind, angle:pick.angle, tags:pick.tags, venueType:pick.venueType},
      detail:null, candidates:null, returnTo:prev};
    trail.nodes[target.id] = target;
    bumpTags(trail, pick.tags, 1);
  }
  const label = target.article.headline || target.article.title;
  const jump = {nodeId:target.id, prev, why:pick.why||"", label, moved:true, created:!dup, reused:!!dup};
  app.citedOpen = false;
  trail.cur = {nodeId:target.id, mode:"read"};
  m.pickedLabel = label;
  document.body.classList.remove("chat-open");
  save(); render(); scrollTop();
  await answerFrom(trail, target, m.question, jump, !!dup);
}

/* ---------- Inline vocabulary ---------- */
let termMap = {};
const termKey = t => String(t||"").toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g," ").trim();
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function buildTermMap(detail, article){
  const m = {};
  Object.values(store.terms).forEach(t=>{ if(t && t.term && t.from !== article.title) m[termKey(t.term)] = {term:t.term, meaning:t.meaning, analogy:t.analogy||"", earlier:true}; });
  (detail.terms||[]).forEach(t=>{ if(t && t.term) m[termKey(t.term)] = {term:t.term, meaning:t.meaning||"", analogy:t.analogy||"", earlier:false}; });
  return m;
}
function lookupTerm(word, map){
  const k = termKey(word);
  if(map[k]) return k;
  const trims = [k.replace(/es$/,""), k.replace(/s$/,""), k+"s"];
  for(const t of trims) if(map[t]) return t;
  const keys = Object.keys(map).sort((a,b)=>b.length-a.length);
  return keys.find(x => x.length>3 && (k.includes(x) || x.includes(k))) || null;
}
function termSpan(text, key, map){
  const t = map[key];
  return `<span class="term${t.earlier?" known":""}" role="button" tabindex="0" data-term="${esc(key)}" aria-label="${esc(text)}: show meaning">${esc(text)}</span>`;
}
function autoMark(seg, map, used, newOnly){
  const keys = Object.keys(map).filter(k => !used.has(k) && k.length>=3 && (!newOnly || !map[k].earlier)).sort((a,b)=>b.length-a.length);
  if(!keys.length) return esc(seg);
  const re = new RegExp("(?<![A-Za-z0-9])(" + keys.map(reEsc).join("|") + ")(?:e?s)?(?![A-Za-z0-9])", "gi");
  let out = "", last = 0;
  seg.replace(re, (m, g, off) => {
    const k = termKey(g); if(used.has(k) || !map[k]) return m;
    used.add(k); out += esc(seg.slice(last, off)) + termSpan(m, k, map); last = off + m.length; return m;
  });
  return out + esc(seg.slice(last));
}
function markup(text, map, used, newOnly){
  const parts = String(text||"").split(/\[\[([^\]]+?)\]\]/);
  const marked = parts.map((p,i)=> i%2 ? lookupTerm(p, map) : null);
  marked.forEach(k=>{ if(k) used.add(k); });
  return parts.map((p,i)=>{
    if(i%2){ const k = marked[i]; return k ? termSpan(p, k, map) : esc(p); }
    return autoMark(p, map, used, newOnly);
  }).join("");
}

/* Popover */
const pop = document.createElement("div");
pop.id = "termpop"; pop.setAttribute("role","dialog"); pop.hidden = true;
document.body.appendChild(pop);
let popFor = null, popPinned = false;
const canHover = window.matchMedia && matchMedia("(hover: hover)").matches;
function showPop(el, pin){
  const t = termMap[el.dataset.term]; if(!t) return;
  popFor = el; popPinned = !!pin;
  pop.innerHTML = `<div class="pop-term">${esc(t.term)}</div><div class="pop-mean">${esc(t.meaning)}</div>${t.analogy?`<div class="pop-ana">${esc(t.analogy)}</div>`:""}${t.earlier?`<div class="pop-note">You learned this in an earlier article.</div>`:""}`;
  pop.hidden = false;
  document.querySelectorAll(".term.active").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  const r = el.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 24);
  pop.style.width = w + "px";
  let left = Math.max(12, Math.min(r.left + r.width/2 - w/2, window.innerWidth - w - 12));
  pop.style.left = left + "px";
  const h = pop.offsetHeight;
  const below = r.bottom + 10;
  pop.style.top = (below + h > window.innerHeight - 8 && r.top - h - 10 > 8 ? r.top - h - 10 : below) + "px";
}
function hidePop(){ pop.hidden = true; popFor = null; popPinned = false; document.querySelectorAll(".term.active").forEach(x=>x.classList.remove("active")); }
document.addEventListener("pointerover", e=>{ if(!canHover || e.pointerType==="touch") return; const el = e.target.closest(".term"); if(el && !popPinned) showPop(el, false); });
document.addEventListener("pointerout", e=>{ if(!canHover || e.pointerType==="touch") return; const el = e.target.closest(".term"); if(el && el===popFor && !popPinned && !(e.relatedTarget && pop.contains(e.relatedTarget))) hidePop(); });
pop.addEventListener("pointerleave", ()=>{ if(!popPinned) hidePop(); });
document.addEventListener("click", e=>{
  const el = e.target.closest(".term");
  if(el){ if(popFor===el && popPinned) hidePop(); else showPop(el, true); return; }
  if(!pop.hidden && !pop.contains(e.target)) hidePop();
}, true);
document.addEventListener("keydown", e=>{
  const el = e.target.closest && e.target.closest(".term");
  if(el && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); if(popFor===el && popPinned) hidePop(); else showPop(el, true); }
  if(e.key==="Escape" && app.lim && pop.hidden){ app.lim = null; render(); return; }
  if(e.key==="Escape" && !pop.hidden){ const f = popFor; hidePop(); if(f) f.focus(); }
});
document.addEventListener("focusin", e=>{ const el = e.target.closest && e.target.closest(".term"); if(el && e.target.matches(":focus-visible")) showPop(el, false); });
window.addEventListener("scroll", ()=>{ if(!pop.hidden) hidePop(); }, true);
window.addEventListener("resize", ()=>{ if(!pop.hidden) hidePop(); });


/* ---------- Works cited ---------- */
const STYLES = {apa:{label:"APA 7", heading:"References"}, mla:{label:"MLA 9", heading:"Works Cited"}, chicago:{label:"Chicago", heading:"Bibliography"}};
const citeStyle = () => STYLES[store.citeStyle] ? store.citeStyle : "apa";
const Tx = t => ({t:String(t)}), It = t => ({t:String(t), i:true});
const endP = str => { str = String(str||"").trim(); return /[.?!]$/.test(str) ? str : str + "."; };
const dash = pg => String(pg||"").replace(/\s*[-\u2010-\u2013]\s*/g, "\u2013");
function citeData(node){
  const a = node.article || {}, c = (node.detail && node.detail.citation) || {};
  const authors = Array.isArray(c.authors) ? c.authors.filter(x=>x && (x.family||x.given)).map(x=>({family:String(x.family||"").trim(), given:String(x.given||"").trim()})) : [];
  return { type: String(c.type || (a.preprint ? "preprint" : "journal")).toLowerCase(), authors, raw: String(a.authors||"").trim(),
    year: String(c.year || a.year || "n.d."), title: String(c.title || a.title || "").trim(), container: String(c.container || a.venue || "").trim(),
    volume: String(c.volume||"").trim(), issue: String(c.issue||"").trim(), pages: dash(c.pages), publisher: String(c.publisher||"").trim(),
    doi: String(c.doi||"").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,"").replace(/^doi:\s*/i,""), url: String(c.url||"").trim() };
}
const link = c => c.doi ? "https://doi.org/" + c.doi : c.url;
const initials = g => String(g||"").split(/\s+/).filter(Boolean).map(p => p.split("-").map(x => x ? x[0].toUpperCase() + "." : "").join("-")).join(" ");
function authorsAPA(c){
  if(!c.authors.length) return endP(c.raw || c.container);
  const n = c.authors.map(x => x.given ? `${x.family}, ${initials(x.given)}` : x.family);
  if(n.length===1) return endP(n[0]);
  if(n.length<=20) return endP(n.slice(0,-1).join(", ") + ", & " + n[n.length-1]);
  return endP(n.slice(0,19).join(", ") + ", . . . " + n[n.length-1]);
}
function authorsMLA(c){
  if(!c.authors.length) return c.raw ? endP(c.raw) : "";
  const f = x => x.given ? `${x.family}, ${x.given}` : x.family, g = x => x.given ? `${x.given} ${x.family}` : x.family;
  if(c.authors.length===1) return endP(f(c.authors[0]));
  if(c.authors.length===2) return endP(`${f(c.authors[0])}, and ${g(c.authors[1])}`);
  return `${f(c.authors[0])}, et al.`;
}
function authorsChicago(c){
  if(!c.authors.length) return c.raw ? endP(c.raw) : "";
  const f = x => x.given ? `${x.family}, ${x.given}` : x.family, g = x => x.given ? `${x.given} ${x.family}` : x.family;
  const list = c.authors.length > 10 ? c.authors.slice(0,7) : c.authors;
  const names = list.map((x,i)=> i===0 ? f(x) : g(x));
  let out = names.length===1 ? names[0] : names.length===2 ? `${names[0]}, and ${names[1]}` : names.slice(0,-1).join(", ") + ", and " + names[names.length-1];
  if(c.authors.length > 10) out = names.join(", ") + ", et al";
  return endP(out);
}
function formatCite(node, style){
  const c = citeData(node), L = link(c), segs = [];
  const conf = c.type==="conference", pre = c.type==="preprint", book = c.type==="book";
  if(style==="apa"){
    segs.push(Tx(authorsAPA(c) + " (" + c.year + "). "));
    if(book){ segs.push(It(endP(c.title))); if(c.publisher) segs.push(Tx(" " + endP(c.publisher))); }
    else {
      segs.push(Tx(c.title.replace(/[.]$/,"") + (pre ? " [Preprint]. " : /[?!]$/.test(c.title) ? " " : ". ")));
      if(conf){ segs.push(Tx("In ")); segs.push(It(c.container)); segs.push(Tx(c.pages ? ` (pp. ${c.pages}). ` : ". ")); if(c.publisher) segs.push(Tx(endP(c.publisher) + " ")); }
      else if(c.container){
        segs.push(It(c.container));
        if(c.volume){ segs.push(Tx(", ")); segs.push(It(c.volume)); if(c.issue) segs.push(Tx(`(${c.issue})`)); }
        segs.push(Tx(c.pages ? `, ${c.pages}. ` : ". "));
      }
    }
    if(L) segs.push(Tx(" " + L));
  } else if(style==="mla"){
    const au = authorsMLA(c); if(au) segs.push(Tx(au + " "));
    if(book){ segs.push(It(endP(c.title))); segs.push(Tx(" " + [c.publisher, c.year].filter(Boolean).join(", ") + ".")); }
    else {
      segs.push(Tx("\u201C" + endP(c.title) + "\u201D "));
      if(c.container){ segs.push(It(c.container)); }
      const bits = [];
      if(c.volume) bits.push("vol. " + c.volume);
      if(c.issue) bits.push("no. " + c.issue);
      bits.push(c.year);
      if(c.pages) bits.push((/^\d+\u2013\d+$/.test(c.pages) ? "pp. " : "p. ") + c.pages);
      segs.push(Tx((c.container ? ", " : "") + bits.join(", ") + "."));
    }
    if(L) segs.push(Tx(" " + L.replace(/^https?:\/\//, c.doi ? "https://" : "") + "."));
  } else {
    const au = authorsChicago(c); if(au) segs.push(Tx(au + " "));
    if(book){ segs.push(It(endP(c.title))); segs.push(Tx(" " + [c.publisher, c.year].filter(Boolean).join(", ") + ".")); }
    else {
      segs.push(Tx("\u201C" + endP(c.title) + "\u201D "));
      if(conf){ segs.push(Tx("In ")); segs.push(It(c.container)); segs.push(Tx((c.pages ? ", " + c.pages : "") + ". " + [c.publisher, c.year].filter(Boolean).join(", ") + ".")); }
      else if(pre){ segs.push(Tx("Preprint, ")); segs.push(It(c.container || "preprint server")); segs.push(Tx(", " + c.year + ".")); }
      else {
        if(c.container) segs.push(It(c.container));
        segs.push(Tx((c.volume ? " " + c.volume : "") + (c.issue ? ", no. " + c.issue : "") + " (" + c.year + ")" + (c.pages ? ": " + c.pages : "") + "."));

    }
    if(L) segs.push(Tx(" " + L + "."));
  }
  // tidy doubled punctuation and spaces across segment boundaries
  const out = segs.filter(x=>x.t);
  for(let i=0;i<out.length;i++){ out[i].t = out[i].t.replace(/\.\./g,".").replace(/\s{2,}/g," "); if(i>0 && /\s$/.test(out[i-1].t) && /^\s/.test(out[i].t)) out[i].t = out[i].t.replace(/^\s+/,""); }
  if(out.length) out[0].t = out[0].t.replace(/^\s+/,""), out[out.length-1].t = out[out.length-1].t.replace(/\s+$/,"");
  return out;
}
function citedNodes(trail){
  return Object.values(trail.nodes).filter(n => n.kind==="article" && n.detail && n.cited !== false);
}
function sortKey(n){ const c = citeData(n); return ((c.authors[0] && c.authors[0].family) || c.raw || c.title).toLowerCase() + " " + c.year; }
const sortedCited = trail => citedNodes(trail).sort((a,b)=> sortKey(a).localeCompare(sortKey(b)));
const segHTML = segs => segs.map(x => x.i ? `<em>${esc(x.t)}</em>` : esc(x.t)).join("");
const segText = segs => segs.map(x=>x.t).join("");
function bibtex(n){
  const c = citeData(n);
  const fam = ((c.authors[0] && c.authors[0].family) || c.raw.split(/[ ,]/)[0] || "anon").toLowerCase().normalize("NFD").replace(/[^a-z]/g,"");
  const word = (c.title.toLowerCase().match(/[a-z]{4,}/) || ["paper"])[0];
  const type = {journal:"article", conference:"inproceedings", book:"book", chapter:"incollection", report:"techreport"}[c.type] || "misc";
  const brace = v => String(v).replace(/[{}]/g,"");
  const f = [["author", c.authors.length ? c.authors.map(x=> x.given ? `${x.family}, ${x.given}` : x.family).join(" and ") : c.raw], ["title", `{${brace(c.title)}}`], ["year", c.year]];
  if(type==="article") f.push(["journal", c.container]);
  else if(type==="inproceedings" || type==="incollection") f.push(["booktitle", c.container]);
  else if(c.container) f.push(["howpublished", c.container]);
  f.push(["volume", c.volume], ["number", c.issue], ["pages", c.pages.replace(/\u2013/g,"--")], ["publisher", c.publisher], ["doi", c.doi], ["url", c.doi ? "" : c.url]);
  return `@${type}{${fam}${c.year.replace(/\D/g,"")}${word},\n` + f.filter(x=>x[1]).map(x=>`  ${x[0]} = {${x[1]}}`).join(",\n") + "\n}";
}

/* Minimal .docx (stored zip, no compression) */
const CRC = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; };
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for(const [name, text] of files){
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,nb.length,true); c.setUint32(42,offset,true);
    central.push(new Uint8Array(c.buffer), nb);
    offset += 30 + nb.length + data.length;
  }
  const cdSize = central.reduce((s,x)=>s+x.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,offset,true);
  const all = [...parts, ...central, new Uint8Array(e.buffer)], out = new Uint8Array(offset + cdSize + 22); let p = 0;
  for(const a of all){ out.set(a,p); p += a.length; }

}
function buildDocx(heading, entries){
  const x = t => String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const font = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
  const run = (t, it, b) => `<w:r><w:rPr>${font}${b?"<w:b/>":""}${it?"<w:i/>":""}<w:sz w:val="24"/></w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  const spacing = '<w:spacing w:before="0" w:after="0" w:line="480" w:lineRule="auto"/>';
  const body = `<w:p><w:pPr><w:jc w:val="center"/>${spacing}</w:pPr>${run(heading,false,true)}</w:p>`
    + entries.map(segs => `<w:p><w:pPr>${spacing}<w:ind w:left="720" w:hanging="720"/></w:pPr>${segs.map(s=>run(s.t,s.i)).join("")}</w:p>`).join("");
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  return zipStore([
    ["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ["word/document.xml", doc]
  ]);
}

function browserDownloads(){
  return { save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data
      : new Blob([data], {type: /\.docx$/i.test(filename) ? "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        : /\.json$/i.test(filename) ? "application/json" : "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 2000);
    return {status:"saved"};
  }};
}
const dlPromise = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(()=>null).then(d => d || browserDownloads())
  : Promise.resolve(browserDownloads());
let dlState = "pending";
dlPromise.then(d => { dlState = d ? "ok" : "off"; if(app.citedOpen) render(); });
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "research";
async function downloadCited(trail, fmt){
  const style = citeStyle(), list = sortedCited(trail);
  if(!list.length) return;
  const base = `works-cited-${slug(trail.topic)}`;
  let filename, data;
  if(fmt==="docx"){ filename = base + ".docx"; data = buildDocx(STYLES[style].heading, list.map(n=>formatCite(n, style))); }
  else if(fmt==="txt"){ filename = base + ".txt"; data = STYLES[style].heading + "\n\n" + list.map(n=>segText(formatCite(n, style))).join("\n\n") + "\n"; }
  else { filename = base + "-bibtex.txt"; data = list.map(bibtex).join("\n\n") + "\n"; }
  busy.dl = {msg:"Waiting for you to confirm the download…"}; render();
  try{
    const d = await dlPromise; if(!d) throw {code:"unavailable"};
    await d.save({filename, data});
    busy.dl = {msg:"Downloaded " + filename + "."};
  }catch(e){
    busy.dl = {msg: e && e.code==="declined" ? "Download canceled." : e && e.code==="rate_limited" ? "A download prompt is already open. Finish that one first." : "Downloads aren't available here. Use Copy all instead.", err: !(e && e.code==="declined")};
  }
  render();
}
async function copyCited(trail){
  const style = citeStyle();
  const text = STYLES[style].heading + "\n\n" + sortedCited(trail).map(n=>segText(formatCite(n, style))).join("\n\n");
  try{ await navigator.clipboard.writeText(text); busy.dl = {msg:"Copied your works cited."}; }
  catch(e){ busy.dl = {msg:"Couldn't reach the clipboard. Select the list below and copy it.", err:true}; }
  render();
}


/* ---------- Limitations ---------- */
function allLimits(trail){
  const out = [];
  Object.values(trail.nodes).filter(n=>n.kind==="article" && n.detail && (n.detail.limitations||[]).length)
    .sort((a,b)=>a.created-b.created)
    .forEach(n => n.detail.limitations.forEach((L,i)=> out.push({node:n, i, L})));
  return out;
}
function limKey(nodeId, i){ return nodeId + "#" + i; }
async function loadFixes(trail, nodeId, i){
  const node = trail.nodes[nodeId]; if(!node) return;
  const L = (node.detail.limitations||[])[i]; if(!L) return;
  const k = limKey(nodeId, i);
  if(!trail.fixes) trail.fixes = {};
  if(busy[k] && busy[k].loading) return;
  busy[k] = {loading:true}; render();
  const f = fieldById(trail.field);
  const a = node.article;
  const seen = Object.values(trail.nodes).filter(n=>n.kind==="article").map(n=>n.article.title);
  const prompt = `You are a research librarian in ${f.name}.
A reader is studying "${a.title}" (${a.authors}, ${a.year}, ${a.venue}) and wants to know what has been done about one of its limitations.
The limitation: "${L.name}" — ${L.detail}
${trail.lens ? `The reader is focused on this application: "${trail.lens}".` : ""}

Find 3 real papers that ATTACK this specific limitation: later work that fixes, reduces, works around, or measures it, or a competing approach that avoids it. Prefer work published after ${a.year||"this paper"}, but a good earlier paper that already solves it is fine.
Every paper must be real, one you are highly confident exists with exact title, authors, year, and venue, from a reputable peer-reviewed venue or a well-known preprint server, never from a publisher on Beall's list. Do not repeat these titles the reader already has: ${seen.length ? seen.map(t=>`"${t}"`).join("; ") : "(none)"}. If you are confident about fewer than 3, return only the ones you are sure of; return an empty list rather than invent one.

/* ---------- Backup and restore ---------- */
function backupData(){
  return JSON.stringify({app:"trailhead", version:1, saved:new Date().toISOString(), store}, null, 2);
}
async function saveBackup(){
  const name = `trailhead-backup-${new Date().toISOString().slice(0,10)}.json`;
  busy.backup = {msg:"Waiting for you to confirm the download…"}; render();
  try{
    const d = await dlPromise; if(!d) throw {code:"unavailable"};
    await d.save({filename:name, data:backupData()});
    busy.backup = {msg:`Saved ${name}. Keep it somewhere safe — you can restore from it any time.`};
  }catch(e){
    if(e && e.code==="declined") busy.backup = {msg:"Backup canceled."};
    else {
      try{ await navigator.clipboard.writeText(backupData()); busy.backup = {msg:"Downloads aren't available here, so your backup was copied to the clipboard. Paste it into a text file and keep it."}; }
      catch(e2){ busy.backup = {msg:"Couldn't save a backup here. Your trails are still stored in this browser.", err:true}; }
    }
  }
  render();
}
function restoreBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      const incoming = (parsed && parsed.store) || parsed;
      if(!incoming || !Array.isArray(incoming.trails)) throw new Error("shape");
      const have = new Set(store.trails.map(t=>t.id));
      const added = incoming.trails.filter(t => t && t.id && !have.has(t.id));
      store.trails = added.concat(store.trails).slice(0,30);
      store.terms = Object.assign({}, incoming.terms||{}, store.terms);
      if(incoming.citeStyle && !store.citeStyle) store.citeStyle = incoming.citeStyle;
      save();
      busy.backup = {msg: added.length ? `Restored ${added.length} trail${added.length===1?"":"s"}.` : "That backup held nothing new — your trails were already here."};
    }catch(e){ busy.backup = {msg:"That file isn't a Trailhead backup.", err:true}; }
    render();
  };
  r.onerror = () => { busy.backup = {msg:"Couldn't read that file.", err:true}; render(); };
  r.readAsText(file);
}


/* ---------- Keeping prompts under the size cap ---------- */
const MAX_PROMPT = 56000;                       // headroom under the platform's 64 KiB
const byteLen = t => { try { return new TextEncoder().encode(String(t)).length; } catch(e){ return String(t).length; } };
/* make(level) returns the prompt with less context at each higher level */
async function askFitted(make, opts, levels){
  const top = (levels || 4) - 1;
  let last = null;
  for(let lvl = 0; lvl <= top; lvl++){
    const prompt = make(lvl);
    if(lvl < top && byteLen(prompt) > MAX_PROMPT) continue;   // too big: shrink before sending
    try { return await askJSON(prompt, opts); }
    catch(e){
      last = e;
      // the platform disagreed about the size, or the reply got cut: try with less
      if(lvl < top && e && (e.code === "prompt_too_large" || e.code === "invalid_json" || e.code === "truncated")) continue;
      throw e;
    }
  }
  throw last || {code:"prompt_too_large"};
}

function startIdea(trail, nodeId, limIndex){
  const node = trail.nodes[nodeId]; if(!node || !node.detail) return;
